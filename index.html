// ---- js/history.js
// undo/redo of settings + text snapshots, with merge windows for typing bursts and slider drags

class History {
  constructor(limit = 200) {
    this.undoStack = [];
    this.redoStack = [];
    this.limit = limit;
    this.lastKey = null;
    this.lastTime = 0;
    this.onChange = null;
  }

  // push the state as it was *before* a change. mergeKey groups rapid edits (e.g. a typing burst)
  push(state, mergeKey = null, mergeMs = 900) {
    const now = performance.now();
    if (mergeKey && mergeKey === this.lastKey && now - this.lastTime < mergeMs) {
      this.lastTime = now;
      return;
    }
    this.undoStack.push(state);
    if (this.undoStack.length > this.limit) this.undoStack.shift();
    this.redoStack.length = 0;
    this.lastKey = mergeKey;
    this.lastTime = now;
    this.onChange?.();
  }

  breakMerge() { this.lastKey = null; }

  undo(current) {
    if (!this.undoStack.length) return null;
    this.redoStack.push(current);
    this.lastKey = null;
    const s = this.undoStack.pop();
    this.onChange?.();
    return s;
  }

  redo(current) {
    if (!this.redoStack.length) return null;
    this.undoStack.push(current);
    this.lastKey = null;
    const s = this.redoStack.pop();
    this.onChange?.();
    return s;
  }

  get canUndo() { return this.undoStack.length > 0; }
  get canRedo() { return this.redoStack.length > 0; }
}

// ---- js/textmodel.js
// text with a stable id per character so glyphs keep their melt state across edits

class TextModel {
  constructor(text = '') {
    this.nextId = 1;
    this.text = '';
    this.ids = [];
    this.replaceAll(text);
  }

  replaceAll(text) {
    this.text = text;
    this.ids = Array.from({ length: text.length }, () => this.nextId++);
  }

  // diff by common prefix/suffix; unchanged characters keep their ids
  update(next) {
    const a = this.text, b = next;
    if (a === b) return false;
    let p = 0;
    const max = Math.min(a.length, b.length);
    while (p < max && a[p] === b[p]) p++;
    let s = 0;
    while (s < max - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;
    const mid = b.length - p - s;
    const ids = this.ids.slice(0, p);
    for (let i = 0; i < mid; i++) ids.push(this.nextId++);
    ids.push(...this.ids.slice(a.length - s));
    this.text = b;
    this.ids = ids;
    return true;
  }

  snapshot() { return { text: this.text, ids: this.ids.slice() }; }

  restore(snap) {
    this.text = snap.text;
    this.ids = snap.ids.slice();
    const m = this.ids.reduce((x, y) => Math.max(x, y), 0);
    this.nextId = Math.max(this.nextId, m + 1);
  }
}


// ---- js/dotsetter.js
// typesetting straight from the dot data: word wrap, tracking, alignment, caret map, and dot positions
class DotSetter {
  glyph(ch) {
    if (this.family && this.family !== 'interdot') return this.dotify(this.family, ch);
    const G = FONT.glyphs;
    return G[ch] || G[ch.toLowerCase()] || G[ch.toUpperCase()] || null;
  }

  // any other face is set on Interdot's grid: draw the letter, and keep a dot wherever the grid
  // point falls inside it. Same pitch, bearing and units as Interdot, so every effect works on it
  dotify(family, ch) {
    const key = family + '\u0000' + ch;
    this.cache ??= new Map();
    if (this.cache.has(key)) return this.cache.get(key);
    const px = 200, u = FONT.upm / px, pitch = 96.5;
    const c = this.dotCanvas ??= document.createElement('canvas');
    const g = c.getContext('2d', { willReadFrequently: true });
    g.font = `${px}px ${family}`;
    const adv = g.measureText(ch).width * u;
    const w = Math.ceil(adv / u) + 40, h = Math.ceil(1.4 * px), base = Math.round(1.05 * px);
    if (c.width < w || c.height < h) { c.width = Math.max(c.width, w); c.height = Math.max(c.height, h); }
    g.clearRect(0, 0, c.width, c.height);
    g.font = `${px}px ${family}`;
    g.fillStyle = '#000';
    g.fillText(ch, 0, base);
    const img = g.getImageData(0, 0, c.width, c.height).data;
    const at = (x, y) => (x < 0 || y < 0 || x >= c.width || y >= c.height) ? 0 : img[(y * c.width + x) * 4 + 3];
    const dots = [];
    if (!/\s/.test(ch)) {
      for (let j = -3; j <= 10; j++) {
        const fy = 31 + j * pitch;
        for (let i = 0; 71 + i * pitch < adv + pitch * 0.5; i++) {
          const fx = 71 + i * pitch;
          const x = Math.round(fx / u), y = Math.round(base - fy / u);
          // a little neighbourhood, so a thin stroke between grid points still lands its dot
          const s = Math.round(pitch * 0.18 / u);
          const cov = (at(x, y) + at(x - s, y) + at(x + s, y) + at(x, y - s) + at(x, y + s)) / (5 * 255);
          if (cov > 0.45) dots.push(fx, fy);
        }
      }
    }
    const out = [Math.max(adv, 120), dots];
    this.cache.set(key, out);
    return out;
  }

  advance(ch) {
    const g = this.glyph(ch);
    return g ? g[0] : FONT.glyphs[' '][0];
  }

  radius(weight) { return FONT.radii[weight] ?? FONT.radii.light; }

  // text: string; ids: stable per-character ids; s: typography settings; art: {w, h}
  layout(text, ids, s, art) {
    this.family = s.font || 'interdot';
    const size = s.fontSize;
    const k = size / FONT.upm;
    const R = this.radius(s.weight);
    const off = R - FONT.base;
    const track = s.tracking * size;
    const capHeight = (FONT.cap - FONT.base + off + R) * k;
    const descent = -FONT.desc * k;
    const lineH = s.leading * size;
    const maxW = Math.max(10, art.w - s.marginLeft - s.marginRight);
    const measure = (str) => {
      let w = 0;
      for (const ch of str) w += this.advance(ch) * k + track;
      return str.length ? w : 0;
    };

    // split into paragraphs, then greedy word wrap
    const lines = [];
    let pStart = 0;
    const paras = text.split('\n');
    for (let pi = 0; pi < paras.length; pi++) {
      const para = paras[pi];
      const base = pStart;
      if (para.length === 0) {
        lines.push({ start: base, end: base });
      } else {
        const tokens = para.match(/\S+\s*|\s+/g) || [];
        let lineStart = base, lineText = '', cursor = base;
        for (const tok of tokens) {
          const trial = lineText + tok;
          if (lineText.length && measure(trial.trimEnd()) > maxW) {
            lines.push({ start: lineStart, end: cursor });
            lineStart = cursor; lineText = '';
          }
          if (!lineText.length && measure(tok.trimEnd()) > maxW) {
            let chunk = '';
            for (let ci = 0; ci < tok.length; ci++) {
              const ch = tok[ci];
              if (chunk.length && measure((chunk + ch).trimEnd()) > maxW) {
                lines.push({ start: lineStart, end: cursor + ci });
                lineStart = cursor + ci; chunk = '';
              }
              chunk += ch;
            }
            lineText = chunk;
          } else {
            lineText += tok;
          }
          cursor += tok.length;
        }
        lines.push({ start: lineStart, end: cursor });
      }
      pStart += para.length + 1;
    }

    const n = lines.length;
    const blockH = capHeight + (n - 1) * lineH + descent * 0.35;
    const availH = art.h - s.marginTop - s.marginBottom;
    let top;
    if (s.valign === 'top') top = s.marginTop;
    else if (s.valign === 'bottom') top = s.marginTop + availH - blockH;
    else top = s.marginTop + (availH - blockH) / 2;
    const firstBaseline = top + capHeight;

    const glyphs = [];
    const carets = new Array(text.length + 1);
    const lineInfo = [];
    for (let li = 0; li < n; li++) {
      const L = lines[li];
      const str = text.slice(L.start, L.end);
      const vis = str.replace(/\s+$/, '');
      const width = vis.length ? measure(vis) - track : 0;
      let x0;
      if (s.align === 'left' || s.align === 'justify') x0 = s.marginLeft;
      else if (s.align === 'right') x0 = s.marginLeft + maxW - width;
      else x0 = s.marginLeft + (maxW - width) / 2;
      // justify: every line but a paragraph's last is spread to the full measure, at its spaces
      const lastOfPara = L.end >= text.length || text[L.end] === '\n';
      const spaces = (vis.match(/ /g) || []).length;
      const extra = s.align === 'justify' && !lastOfPara && spaces ? (maxW - width) / spaces : 0;
      const y = firstBaseline + li * lineH;
      const xs = [x0];
      for (let i = 0; i < str.length; i++) xs.push(xs[i] + this.advance(str[i]) * k + track + (str[i] === ' ' && i < vis.length ? extra : 0));
      for (let i = 0; i < str.length; i++) {
        const gi = L.start + i;
        carets[gi] = { x: xs[i], y, line: li };
        const ch = str[i];
        const gd = this.glyph(ch);
        if (!/\s/.test(ch) && gd && gd[1].length) {
          const c = gd[1];
          const dots = [];
          for (let j = 0; j < c.length; j += 2) dots.push([xs[i] + (c[j] + off) * k, y - (c[j + 1] + off) * k]);
          glyphs.push({ ch, id: ids[gi], charIndex: gi, x: xs[i], y, line: li, r: R * k, adv: xs[i + 1] - xs[i], dots });
        }
      }
      const endIdx = L.end;
      if (carets[endIdx] === undefined || li === n - 1 || text[endIdx] === '\n') {
        carets[endIdx] = { x: xs[str.length], y, line: li };
      }
      lineInfo.push({ start: L.start, end: L.end, y, x0, width });
    }
    for (let i = 0; i <= text.length; i++) {
      if (!carets[i]) carets[i] = { x: s.marginLeft, y: firstBaseline, line: 0 };
    }
    glyphs.forEach((g, i) => { g.index = i; });
    return { glyphs, carets, lines: lineInfo, descent, capHeight, lineH, size, track, r: R * k, pitch: 96 * k };
  }

  hitTest(lay, x, y) {
    if (!lay) return 0;
    let bestLine = 0, bd = Infinity;
    lay.lines.forEach((L, i) => {
      const d = Math.abs(y - (L.y - lay.capHeight * 0.5));
      if (d < bd) { bd = d; bestLine = i; }
    });
    const L = lay.lines[bestLine];
    let best = L.start, bx = Infinity;
    for (let i = L.start; i <= L.end; i++) {
      const c = lay.carets[i];
      if (!c || c.line !== bestLine) continue;
      const d = Math.abs(c.x - x);
      if (d < bx) { bx = d; best = i; }
    }
    return best;
  }
}

// small deterministic prng so a seed always congeals the same dots
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash2(a, b) { return (Math.imul(a ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(b + 0x632be5ab, 0xc2b2ae35)) >>> 0; }

// ---- js/sim.js
// gpu simulation driver: textures, parameters, adaptive substepping, gather wells, injection, probing, stats
function smooth01(x) { x = Math.min(Math.max(x, 0), 1); return x * x * (3 - 2 * x); }

class Simulation {
  constructor(kit) {
    this.kit = kit;
    this.p = {
      pressure: kit.program(pressureFS, undefined, 'pressure'),
      velocity: kit.program(velocityFS, undefined, 'velocity'),
      update: kit.program(updateFS, undefined, 'update'),
      collect: kit.program(collectFS, undefined, 'collect'),
      inject: kit.program(injectFS, undefined, 'inject'),
      wipe: kit.program(wipeFS, undefined, 'wipe'),
      probe: kit.program(probeFS, undefined, 'probe'),
      resolve: kit.program(resolveFS, undefined, 'resolve'),
      stats: kit.program(statsFS, undefined, 'stats'),
    };
    this.nx = 0; this.ny = 0;
    this.t = null;
    this.stats = { volume: 0, maxDepth: 0, wetCells: 0 };
    this.hmaxEst = 0.003;
    this.simTime = 0;
    this.lastSubsteps = 0;
    this.slowdown = 1;
    this.statsPending = false;
    this.probePending = false;
  }

  allocate(nx, ny) {
    const k = this.kit;
    if (this.t) for (const key in this.t) { const v = this.t[key]; (Array.isArray(v) ? v : [v]).forEach(x => k.deleteTexture(x)); }
    this.nx = nx; this.ny = ny;
    const f = () => k.texture(nx, ny, 'rgba32f');
    this.t = {
      L: [f(), f()], U: [f(), f()], V: [f(), f()], W: [f(), f()],
      P: f(),
      G: f(),
      res: k.texture(nx, ny, 'rgba16f', { filter: 'linear', mipmap: true }),
    };
    this.gData = new Float32Array(nx * ny * 4);
    this.cur = { L: 0, U: 0, V: 0, W: 0 };
    this.clear();
  }

  get L() { return this.t.L[this.cur.L]; }
  get U() { return this.t.U[this.cur.U]; }
  get V() { return this.t.V[this.cur.V]; }
  get W() { return this.t.W[this.cur.W]; }
  next(n) { return this.t[n][1 - this.cur[n]]; }
  flip(n) { this.cur[n] = 1 - this.cur[n]; }

  clear() {
    const k = this.kit;
    ['L', 'U', 'V', 'W'].forEach(n => this.t[n].forEach(x => k.clear(x)));
    k.clear(this.t.res);
    k.genMips(this.t.res);
    this.gData.fill(0);
    this.uploadGather();
    this.hmaxEst = 0.003;
  }

  uploadGather() {
    const gl = this.kit.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.t.G.tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, this.nx, this.ny, gl.RGBA, gl.FLOAT, this.gData);
  }

  // paint a gather well: liquid inside the capsule a -> b (cells) is pulled toward b
  paintGather(ax, ay, bx, by, rad, strength, start) {
    const { nx, ny, gData: g } = this;
    const x0 = Math.max(0, Math.floor(Math.min(ax, bx) - rad)), x1 = Math.min(nx - 1, Math.ceil(Math.max(ax, bx) + rad));
    const y0 = Math.max(0, Math.floor(Math.min(ay, by) - rad)), y1 = Math.min(ny - 1, Math.ceil(Math.max(ay, by) + rad));
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const px = x + 0.5, py = y + 0.5;
        const t = l2 > 0 ? Math.min(Math.max(((px - ax) * dx + (py - ay) * dy) / l2, 0), 1) : 0;
        const ex = px - (ax + dx * t), ey = py - (ay + dy * t);
        if (ex * ex + ey * ey > rad * rad) continue;
        const i = (y * nx + x) * 4;
        g[i] = bx; g[i + 1] = by; g[i + 2] = strength; g[i + 3] = start;
      }
    }
  }

  physics(ph) {
    const dx = ph.dx;
    const sigma = ph.sigma;
    const hc = 1.1 * dx;
    const wetAt = (deg) => {
      const afac = 1 + 0.7 * Math.min(Math.max((100 - deg) / 50, 0), 1.4);
      return sigma * (1 - Math.cos(deg * Math.PI / 180)) / hc * afac;
    };
    const wetPage = wetAt(ph.theta);
    // pinning sets the hysteresis window between advancing and receding contact angles
    const hyst = ph.pinning * 50;
    const wetAdv = wetAt(Math.min(ph.theta + hyst, 175)), wetRec = wetAt(Math.max(ph.theta - hyst * 0.5, 3));
    const G = Math.min(Math.max(ph.gravity, 0), 1);
    // the grid resolves beads far larger than real sweat; scaling gravity by the bond number of a
    // reference bead keeps dots behaving like millimetre beads at any weight or type size
    const gPar = 9.81 * ph.gravity * ph.bond;
    const gPerp = 9.81 * Math.max(Math.sqrt(Math.max(1 - G * G, 0)), 0.25) * ph.bond;
    const ang = ph.gravityAngle * Math.PI / 180;
    const g = [Math.sin(ang) * gPar, -Math.cos(ang) * gPar];
    return {
      dx, sigma, hc, wetPage, wetAdv, wetRec, gPerp, g,
      nu: ph.viscosity / ph.rhoL, rhoL: ph.rhoL,
      pin: ph.pinning * 30.0,
      repel: 2.0 * sigma / hc,
    };
  }

  chooseDt(d) {
    const h = Math.min(Math.max(this.hmaxEst, 0.0015), 0.03);
    const dtc = 0.3 * d.dx * d.dx / Math.sqrt(Math.max(d.sigma, 1e-4) * h / d.rhoL);
    const dtw = 0.5 * d.dx / Math.sqrt(h * Math.max(d.wetAdv, d.wetPage) / (d.hc * d.rhoL) + d.gPerp * h + 1e-9);
    return Math.min(dtc, dtw, 1 / 120);
  }

  // add bead-shaped liquid. dots: [[x, y, r (cells), species], ...]; thetaDeg: bead contact angle
  inject(dots, thetaDeg) {
    const k = this.kit;
    const th = Math.min(Math.max(thetaDeg, 12), 88) * Math.PI / 180;
    for (let i = 0; i < dots.length; i += 64) {
      const batch = dots.slice(i, i + 64);
      const arr = new Float32Array(64 * 4);
      batch.forEach((d, j) => arr.set(d, j * 4));
      k.run(this.p.inject, {
        uN: [this.nx, this.ny], uL: this.L, uDots: arr, uCount: batch.length,
        uCosT: Math.cos(th), uSinT: Math.sin(th), uCellM: this.dx,
      }, this.next('L'));
      this.flip('L');
    }
  }

  // advance by wall-clock frame time. forces: { cur: [x, y, r, on] cells, curVel: [m/s], pull, drag, wipe, life, gatherR, bulkLod, href, pxToM }
  step(frameDt, ph, f, maxSub) {
    const k = this.kit;
    const d = this.physics(ph);
    const dt = this.chooseDt(d);
    const want = Math.min(frameDt, 1 / 20) * ph.timeScale;
    let n = Math.ceil(want / dt);
    if (want <= 0) n = 0;
    this.slowdown = 1;
    if (n > maxSub) { this.slowdown = maxSub / n; n = maxSub; }
    this.lastSubsteps = n;
    if (n === 0) return;
    const N = [this.nx, this.ny];
    const vmax = 0.24 * d.dx / dt;
    const common = { uN: N, uDx: d.dx };
    const pU = {
      ...common, uSigma: d.sigma, uRhoL: d.rhoL, uGperp: d.gPerp, uCongeal: ph.coalesce,
      uWetAdv: d.wetAdv, uWetRec: d.wetRec, uHc: d.hc, uRepel: d.repel, uWc: 0.5, uHetero: 0.35,
    };
    const vU = {
      ...common, uDt: dt, uRhoL: d.rhoL, uNu: d.nu, uSlip: 5e-5 * (1 + 8 * smooth01((ph.theta - 90) / 40)), uFric: 0.0, uVmax: vmax,
      uCongeal: ph.coalesce, uVisc: 0.02, uPin: d.pin, uHdry: 0.3 * d.hc, uG: d.g,
      uBulk: this.t.res, uBulkLod: f.bulkLod, uPxToM: f.pxToM, uHref: f.href,
      uLife: f.life, uGatherR: f.gatherR,
      uCur: f.cur, uCurVel: f.curVel, uCurPull: f.pull, uCurDrag: f.drag,
    };
    const uU = { ...common, uDt: dt, uWetDecay: Math.exp(-dt / 25), uHc: d.hc };
    const collect = Math.min(1, dt * 60) * Math.max(smooth01((ph.theta - 95) / 30), 0.25);
    const wipeAmt = f.wipe ? 1 - Math.exp(-14 * dt) : 0;
    for (let i = 0; i < n; i++) {
      k.run(this.p.pressure, { ...pU, uL: this.L, uW: this.W }, this.t.P);
      k.run(this.p.velocity, { ...vU, uTime: this.simTime, uP: this.t.P, uL: this.L, uU: this.U, uV: this.V, uW: this.W, uGather: this.t.G }, [this.next('U'), this.next('V')]);
      this.flip('U'); this.flip('V');
      k.run(this.p.update, { ...uU, uL: this.L, uU: this.U, uV: this.V, uW: this.W }, [this.next('L'), this.next('W')]);
      this.flip('L'); this.flip('W');
      if (collect > 0) {
        k.run(this.p.collect, { uN: N, uL: this.L, uCollect: collect, uFilm: 0.35 * d.hc }, this.next('L'));
        this.flip('L');
      }
      if (wipeAmt > 0) {
        k.run(this.p.wipe, { uN: N, uL: this.L, uW: this.W, uCur: [f.cur[0], f.cur[1], f.cur[2], wipeAmt] }, [this.next('L'), this.next('W')]);
        this.flip('L'); this.flip('W');
      }
      this.simTime += dt;
    }
  }

  resolve(mToPx) {
    this.kit.run(this.p.resolve, { uL: this.L, uW: this.W, uMToPx: mToPx }, this.t.res);
    this.kit.genMips(this.t.res);
    return this.t.res;
  }

  // liquid depth (m) over each static dot, read back asynchronously
  probe(dotTex, count, cellPerPx, sampleR, cb) {
    if (this.probePending || count <= 0) return;
    const k = this.kit;
    const rows = Math.ceil(count / 4096);
    if (!this.t.probe || this.t.probe.h !== rows) {
      if (this.t.probe) k.deleteTexture(this.t.probe);
      this.t.probe = k.texture(4096, rows, 'rgba32f');
    }
    k.run(this.p.probe, { uN: [this.nx, this.ny], uL: this.L, uDots: dotTex, uCount: count, uCellPerPx: cellPerPx, uSampleR: sampleR }, this.t.probe);
    this.probePending = true;
    k.readFloatAsync(this.t.probe, (data) => { this.probePending = false; cb(data); });
  }

  requestStats() {
    if (this.statsPending) return;
    const k = this.kit;
    let sw = this.nx, sh = this.ny, first = true, src = this.L;
    const temps = [];
    while (first || sw * sh > 1) {
      const nw = Math.ceil(sw / 8), nh = Math.ceil(sh / 8);
      const dst = k.texture(nw, nh, 'rgba32f');
      temps.push(dst);
      k.run(this.p.stats, { uSrc: src, uSrcSize: [sw, sh], uFirst: first ? 1 : 0 }, dst);
      src = dst; sw = nw; sh = nh; first = false;
    }
    this.statsPending = true;
    k.readFloatAsync(src, (data) => {
      this.stats.volume = data[0] * this.dx * this.dx;
      this.stats.maxDepth = data[1];
      this.hmaxEst = Math.max(0.0015, data[1] * 1.3);
      this.statsPending = false;
      temps.forEach(x => k.deleteTexture(x));
    });
  }
}

// ---- js/renderer.js
// renderer: environment map, static dots, height prep, caustics/shadows, liquid composite, bloom/glints, tonemap
const ENV_PRESETS = { studio: 0, soft: 1, night: 2, window: 3 };
const SURFACES = { plain: 0, paper: 1, skin: 2 };

function srgbToLinear(hex) {
  const v = parseInt(hex.slice(1), 16);
  return [(v >> 16) & 255, (v >> 8) & 255, v & 255].map(x => {
    x /= 255;
    return x <= 0.04045 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
  });
}

class Renderer {
  constructor(kit) {
    this.kit = kit;
    this.p = {
      env: kit.program(envFS, undefined, 'env'),
      dots: kit.program(dotsFS, dotsVS, 'dots'),
      segs: kit.program(segFS, segVS, 'segs'),
      heatMask: kit.program(heatMaskFS, undefined, 'heatMask'),
      heat: kit.program(heatFS, undefined, 'heat'),
      heatSeed: kit.program(heatSeedFS, undefined, 'heatSeed'),
      heatStep: kit.program(heatStepFS, undefined, 'heatStep'),
      prep: kit.program(prepFS, undefined, 'prep'),
      causticPrep: kit.program(causticPrepFS, undefined, 'causticPrep'),
      caustic: kit.program(causticFS, causticVS, 'caustic'),
      blur: kit.program(blurFS, undefined, 'blur'),
      comp: kit.program(compositeFS, undefined, 'composite'),
      bright: kit.program(brightFS, undefined, 'bright'),
      down: kit.program(downFS, undefined, 'down'),
      streak: kit.program(streakFS, undefined, 'streak'),
      final: kit.program(finalFS, undefined, 'final'),
    };
    this.env = kit.texture(1024, 512, 'rgba16f', { filter: 'linear', mipmap: true, wrapS: 'repeat' });
    this.dotData = kit.texture(4096, 1, 'rgba32f');
    this.union = { dots: kit.texture(4096, 1, 'rgba32f'), bridges: kit.texture(4096, 1, 'rgba32f'), nd: 0, nb: 0, r: 0, w: 1 };
    // the heat-map lines alone: their dry dots and union shapes
    this.heat = { dots: kit.texture(4096, 1, 'rgba32f'), n: 0, udots: kit.texture(4096, 1, 'rgba32f'), ubridges: kit.texture(4096, 1, 'rgba32f'), nd: 0, nb: 0 };
    this.dotCount = 0;
    this.blank = kit.texture(1, 1, 'rgba8');
    this.img = null;
    this.w = 0; this.h = 0;
    this.t = null;
    this.meshKey = '';
    this.time = 0;
  }

  resize(w, h) {
    if (w === this.w && h === this.h) return;
    const k = this.kit;
    if (this.t) for (const key in this.t) k.deleteTexture(this.t[key]);
    this.w = w; this.h = h;
    const hw = Math.max(2, Math.round(w / 2)), hh = Math.max(2, Math.round(h / 2));
    const q = (d) => [Math.max(2, Math.round(w / d)), Math.max(2, Math.round(h / d))];
    this.t = {
      dot: k.texture(w, h, 'rgba16f', { filter: 'linear' }),
      hdot: k.texture(w, h, 'rgba16f', { filter: 'linear' }),
      prep: k.texture(w, h, 'rgba16f', { filter: 'linear' }),
      caus: k.texture(hw, hh, 'rgba16f', { filter: 'linear' }),
      caus2: k.texture(hw, hh, 'rgba16f', { filter: 'linear' }),
      causRaw: k.texture(hw, hh, 'rgba16f', { filter: 'linear' }),
      hdr: k.texture(w, h, 'rgba16f', { filter: 'linear' }),
      b2: k.texture(...q(2), 'rgba16f', { filter: 'linear' }),
      b4: k.texture(...q(4), 'rgba16f', { filter: 'linear' }),
      b8: k.texture(...q(8), 'rgba16f', { filter: 'linear' }),
      b8b: k.texture(...q(8), 'rgba16f', { filter: 'linear' }),
      sA: k.texture(...q(4), 'rgba16f', { filter: 'linear' }),
      sB: k.texture(...q(4), 'rgba16f', { filter: 'linear' }),
      sT: k.texture(...q(4), 'rgba16f', { filter: 'linear' }),
      b4g: k.texture(...q(4), 'rgba16f', { filter: 'linear' }),
      hm: k.texture(...q(2), 'rgba16f', { filter: 'linear' }),
      hmB: k.texture(...q(2), 'rgba16f', { filter: 'linear' }),
      jA: k.texture(...q(2), 'rgba32f'),
      jB: k.texture(...q(2), 'rgba32f'),
    };
    this.dotsDirty = true;
  }

  ensureMesh(gx, gy) {
    const key = gx + 'x' + gy;
    if (key === this.meshKey) return;
    const idx = new Uint32Array((gx - 1) * (gy - 1) * 6);
    let o = 0;
    for (let j = 0; j < gy - 1; j++) {
      for (let i = 0; i < gx - 1; i++) {
        const a = j * gx + i, b = a + 1, c = a + gx, d = c + 1;
        idx[o++] = a; idx[o++] = b; idx[o++] = d;
        idx[o++] = a; idx[o++] = d; idx[o++] = c;
      }
    }
    if (this.mesh) this.kit.gl.deleteBuffer(this.mesh.buffer);
    this.mesh = this.kit.indexBuffer(idx);
    this.meshKey = key;
    this.grid = [gx, gy];
  }

  // floor: the surface's average colour (the background image's when there is one)
  buildEnv(s, floorHex) {
    const L = s.light;
    this.kit.run(this.p.env, {
      uPreset: ENV_PRESETS[L.env] ?? 0,
      uAz: L.azimuth * Math.PI / 180,
      uEl: L.elevation * Math.PI / 180,
      uBg: srgbToLinear(floorHex || s.mat[s.material].background),
    }, this.env);
    this.kit.genMips(this.env);
  }

  // static dots: Float32Array of (x, y up, r, 0) in artboard px
  setDots(data, count) {
    const k = this.kit, gl = k.gl;
    const rows = Math.max(1, Math.ceil(count / 4096));
    if (this.dotData.h !== rows) { k.deleteTexture(this.dotData); this.dotData = k.texture(4096, rows, 'rgba32f'); }
    const full = new Float32Array(4096 * rows * 4);
    full.set(data.subarray(0, count * 4));
    gl.bindTexture(gl.TEXTURE_2D, this.dotData.tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 4096, rows, gl.RGBA, gl.FLOAT, full);
    this.dotCount = count;
    this.dotsDirty = true;
  }

  // the geometric union: congealed dots and the bridges between them, as segments (artboard px, y up)
  // instances are two texels each: (ax, ay, bx, by), (rA, rB, 0, 0)
  setUnion(dots, nd, bridges, nb, width) {
    const U = this.union;
    U.dots = this.uploadRows(U.dots, dots, nd * 2);
    U.bridges = this.uploadRows(U.bridges, bridges, nb * 2);
    U.nd = nd; U.nb = nb; U.w = width;
    this.dotsDirty = true;
  }

  setHeatDots(data, count) {
    this.heat.dots = this.uploadRows(this.heat.dots, data, count);
    this.heat.n = count;
    this.dotsDirty = true;
  }

  setHeatUnion(dots, nd, bridges, nb) {
    const H = this.heat;
    H.udots = this.uploadRows(H.udots, dots, nd * 2);
    H.ubridges = this.uploadRows(H.ubridges, bridges, nb * 2);
    H.nd = nd; H.nb = nb;
    this.dotsDirty = true;
  }

  uploadRows(tex, data, count) {
    const k = this.kit, gl = k.gl;
    const rows = Math.max(1, Math.ceil(count / 4096));
    if (tex.h !== rows) { k.deleteTexture(tex); tex = k.texture(4096, rows, 'rgba32f'); }
    const full = new Float32Array(4096 * rows * 4);
    full.set(data.subarray(0, count * 4));
    gl.bindTexture(gl.TEXTURE_2D, tex.tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, 4096, rows, gl.RGBA, gl.FLOAT, full);
    return tex;
  }

  drawDots(art, thetaDeg) {
    const k = this.kit, gl = k.gl;
    const th = Math.min(Math.max(thetaDeg, 12), 88) * Math.PI / 180;
    const aa = art[0] / this.w;
    k.clear(this.t.dot);
    const max = { blend: [gl.ONE, gl.ONE], blendEq: gl.MAX };
    k.run(this.p.dots, {
      uDots: this.dotData, uArt: art, uAa: aa, uCosT: Math.cos(th), uSinT: Math.sin(th),
    }, this.t.dot, { ...max, instances: this.dotCount });
    const U = this.union;
    const seg = (tex, n, wf, target = this.t.dot) => k.run(this.p.segs, {
      uSegs: tex, uArt: art, uAa: aa, uWf: wf, uCosT: Math.cos(th), uSinT: Math.sin(th),
    }, target, { ...max, instances: n });
    if (U.nd) seg(U.dots, U.nd, 1);
    if (U.nb) seg(U.bridges, U.nb, U.w);
    // the heat-map lines alone, for the heat map's mask
    const H = this.heat;
    k.clear(this.t.hdot);
    if (H.n) k.run(this.p.dots, {
      uDots: H.dots, uArt: art, uAa: aa, uCosT: Math.cos(th), uSinT: Math.sin(th),
    }, this.t.hdot, { ...max, instances: H.n });
    if (H.nd) seg(H.udots, H.nd, 1, this.t.hdot);
    if (H.nb) seg(H.ubridges, H.nb, U.w, this.t.hdot);
    this.dotsDirty = false;
  }

  setImage(source) {
    if (this.img) this.kit.deleteTexture(this.img);
    this.img = source ? this.kit.textureFromSource(source, { flipY: true, filter: 'linear', mipmap: true }) : null;
  }

  // heatmap: density field at half resolution, blurred by the spread, mapped onto the colour ramp
  renderHeat(scene, res) {
    const k = this.kit, s = scene.settings, H = s.heat, m = s.mat[s.material], sim = scene.sim;
    const [aw] = scene.art;
    k.run(this.p.heatMask, {
      uDotTex: this.t.hdot, uRes: res, uSimN: [sim.nx, sim.ny], uFilmPx: 0.08 / scene.pxMm, uDry: H.dry ? 1 : 0,
    }, this.t.hm);
    // a light blur rounds the outline and lets near neighbours merge (the threshold sits at one half)
    const texArt = aw / this.t.hm.w, step = Math.max(H.merge / texArt / 4.2, 0.05);
    if (H.merge > 0.5) for (let i = 0; i < 4; i++) {
      k.run(this.p.blur, { uSrc: this.t.hm, uDir: [step / this.t.hm.w, 0] }, this.t.hmB);
      k.run(this.p.blur, { uSrc: this.t.hmB, uDir: [0, step / this.t.hm.h] }, this.t.hm);
    }
    // distance to the outline by jump flooding
    const size = [this.t.hm.w, this.t.hm.h];
    k.run(this.p.heatSeed, { uField: this.t.hm, uSize: size }, this.t.jA);
    let src = this.t.jA, dst = this.t.jB;
    for (let st = 1 << Math.ceil(Math.log2(Math.max(...size))) >> 1; st >= 1; st >>= 1) {
      k.run(this.p.heatStep, { uSeeds: src, uSize: size, uStep: st }, dst);
      [src, dst] = [dst, src];
    }
    const cols = new Float32Array(24);
    const list = H.colors.length ? H.colors : ['#ffffff'];
    list.slice(0, 8).forEach((c, i) => cols.set(srgbToLinear(c), i * 3));
    k.run(this.p.heat, {
      uField: this.t.hm, uSeeds: src, uFieldSize: size, uTexArt: texArt, uDotTex: this.t.dot, uCols: cols, uN: Math.min(list.length, 8),
      uOrganic: H.organic ?? 0, uOrgScale: H.orgScale ?? 60,
      uBand: Math.max(H.band, 0.5), uInner: H.inner, uGrowth: H.growth, uBlend: H.blend, uDotsOnTop: H.dotsOnTop ? 1 : 0, uDotCol: srgbToLinear(m.dots),
    }, this.t.hdr);
    k.run(this.p.final, {
      uHdr: this.t.hdr, uBloom: this.t.b8, uStreakA: this.t.sA, uStreakB: this.t.sB,
      uBloomAmt: 0, uGlints: 0, uGrain: 0, uTime: scene.staticGrain ? 0 : this.time, uHasBloom: 0, uKnee: 1,
    }, null);
  }

  // scene: { art, sim, mToPx, pxMm, settings, dotTheta, hmaxPx, imgXf }
  render(scene, dt) {
    const k = this.kit, s = scene.settings, L = s.light, m = s.mat[s.material];
    const merc = s.material === 'mercury';
    this.time += dt;
    const [aw, ah] = scene.art;
    const sim = scene.sim;
    if (this.dotsDirty) this.drawDots(scene.art, scene.dotTheta);
    const res = sim.resolve(scene.mToPx);
    if (scene.heatMode === 'all') { this.renderHeat(scene, res); return; }
    // 1) heights at render resolution
    k.run(this.p.prep, {
      uRes: res, uSimN: [sim.nx, sim.ny], uDotTex: this.t.dot, uBeadStyle: 0,
      uCongeal: s.coalesce, uMeniscus: (merc ? 1.2 : 0.35) / scene.pxMm, uFilmPx: (merc ? 0.12 : 0.08) / scene.pxMm,
    }, this.t.prep);

    // 2) caustics + cast shadows
    const clarity = merc ? 0 : m.clarity;
    const density = merc ? 50 : Math.pow(1 - clarity, 2) * 6;
    const az = L.azimuth * Math.PI / 180, el = L.elevation * Math.PI / 180;
    const Ld = [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)];
    const gx = Math.min(1024, Math.round(this.w / 2)), gy = Math.max(2, Math.round(gx * ah / aw));
    this.ensureMesh(gx, gy);
    if (!this.t.cp || this.t.cp.w !== gx || this.t.cp.h !== gy) {
      if (this.t.cp) k.deleteTexture(this.t.cp);
      this.t.cp = k.texture(gx, gy, 'rgba32f');
    }
    const over = 0.02;
    k.run(this.p.causticPrep, {
      uPrep: this.t.prep, uGrid: this.grid, uArt: [aw, ah], uL: Ld,
      uOpaque: merc ? 1 : 0, uIor: m.ior ?? 1.33, uDensity: density, uPxMm: scene.pxMm,
      uHmax: scene.hmaxPx + 25, uSoft: L.softness * 4.0, uTarget: [this.t.caus.w, this.t.caus.h], uOver: over,
    }, this.t.cp);
    k.run(this.p.caustic, {
      uCP: this.t.cp, uGrid: this.grid, uTarget: [this.t.caus.w, this.t.caus.h], uOver: over,
    }, this.t.causRaw, { clear: [0, 0, 0, 1], blend: [k.gl.ONE, k.gl.ONE], elements: this.mesh });
    const blurR = 1.0 + L.softness * 2.2;
    k.run(this.p.blur, { uSrc: this.t.causRaw, uDir: [blurR / this.t.caus.w, 0] }, this.t.caus2);
    k.run(this.p.blur, { uSrc: this.t.caus2, uDir: [0, blurR / this.t.caus.h] }, this.t.caus);

    // 3) composite
    const bg = srgbToLinear(m.background);
    k.run(this.p.comp, {
      uPrep: this.t.prep, uPrepSize: [this.w, this.h], uCaustic: this.t.caus, uRes: res, uEnv: this.env,
      uArt: [aw, ah], uCam: [aw * 0.5, ah * 0.5, Math.max(aw, ah) * 1.5], uBg: bg, uL: Ld,
      uShadow: L.shadow, uCaustics: L.caustics, uExposure: L.exposure,
      uAoLiquid: merc ? 1.0 : 0.25 + 0.75 * (1 - clarity),
      uCellPx: aw / sim.nx, uGrain2: 0, uWetDarken: merc ? 0 : s.wetTrails,
      uLiqMinMm: merc ? 0.2 : 0.1, uFilmAoPx: (merc ? 0.2 : 0.1) / scene.pxMm,
      uMode: merc ? 1 : 0, uPxMm: scene.pxMm,
      uSurface: 0, uSurfScale: s.surfScale * 0.13 / scene.pxMm,
      uImg: this.img || this.blank, uHasImg: this.img ? 1 : 0, uImgXf: scene.imgXf,
      uImgLod: this.img ? Math.max(0, Math.log2(this.img.w * scene.imgXf[0] / this.w)) : 0,
      uDotCol: srgbToLinear(m.dots),
      uTint: srgbToLinear(m.tint), uIor: m.ior ?? 1.33, uDensity: density, uTintStr: 0.35,
      uLens: s.lens, uRough: merc ? 0.01 : (1 - (m.gloss ?? 1)) * 0.35 + 0.006,
      uFinish: m.finish ?? 0, uMercTint: srgbToLinear(m.tint),
      uFlat: 1, uFlatCol: srgbToLinear(m.tint),
    }, this.t.hdr);

    // 4) bloom + glints
    const glints = merc ? (m.glints ?? 0) : 0;
    const doBloom = false;
    if (doBloom) {
      k.run(this.p.bright, { uSrc: this.t.hdr, uThreshold: 1.0 }, this.t.b2);
      k.run(this.p.down, { uSrc: this.t.b2, uTexel: [0.5 / this.t.b2.w, 0.5 / this.t.b2.h] }, this.t.b4);
      if (glints > 0.001) k.run(this.p.bright, { uSrc: this.t.b4, uThreshold: 2.2 }, this.t.sB);
      k.run(this.p.down, { uSrc: this.t.b4, uTexel: [0.5 / this.t.b4.w, 0.5 / this.t.b4.h] }, this.t.b8);
      k.run(this.p.blur, { uSrc: this.t.b8, uDir: [1.5 / this.t.b8.w, 0] }, this.t.b8b);
      k.run(this.p.blur, { uSrc: this.t.b8b, uDir: [0, 1.5 / this.t.b8.h] }, this.t.b8);
      const st = (dx, dy, dst, srcTex) => {
        let src = srcTex;
        const outs = [dst, this.t.sT, dst];
        for (let it = 0; it < 3; it++) {
          const scale = Math.pow(4, it);
          k.run(this.p.streak, { uSrc: src, uDir: [dx * scale / this.t.b4.w, dy * scale / this.t.b4.h], uAtt: Math.pow(0.9, scale) }, outs[it]);
          src = outs[it];
        }
      };
      if (glints > 0.001) {
        k.run(this.p.down, { uSrc: this.t.sB, uTexel: [0.25 / this.t.sB.w, 0.25 / this.t.sB.h] }, this.t.b4g);
        st(0.7071, 0.7071, this.t.sA, this.t.b4g);
        st(0.7071, -0.7071, this.t.sB, this.t.b4g);
      }
    }
    k.run(this.p.final, {
      uHdr: this.t.hdr, uBloom: this.t.b8, uStreakA: this.t.sA, uStreakB: this.t.sB,
      uBloomAmt: 0, uGlints: 0, uGrain: 0, uTime: scene.staticGrain ? 0 : this.time, uHasBloom: doBloom ? 1 : 0,
      uKnee: 1,   // flat colour: picked colours come out exactly, no highlight roll-off
    }, null);
  }
}


// ---- js/house.js
// the house controls, as in ~/.claude/design/starter.html: slider fill and read-outs, typed values,
// sweeps, saving into the project, recording, the canvas edge and toasts
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
// slider fill and read-out follow the value (not while the read-out is being typed into)
const fill = r => {
  r.style.setProperty('--p', `${(r.value - r.min) / (r.max - r.min) * 100}%`);
  const v = r.closest('.row')?.querySelector('.val');
  if (!v || v.classList.contains('editing')) return;
  const n = +(+r.value).toFixed(3), u = v.dataset.unit;
  v.textContent = !u ? n : u === '×' ? `${n}×` : `${n} ${u}`;
};
// pop-up menus show their choice
const showChoice = sel => sel.parentElement.querySelector('.pvalue').textContent = sel.selectedOptions[0]?.text ?? '';

// canvas edge: when the canvas colour is within 3:1 contrast of the page around it, the board
// gets a hairline in the inverse of the canvas. Re-checked on every canvas colour change and
// whenever the system switches between light and dark.
function rgbOf(c) { return c.startsWith('#') ? c.slice(1).match(/../g).map(h => parseInt(h, 16)) : c.match(/[\d.]+/g).slice(0, 3).map(Number); }
function lum(c) {
  const [r, g, b] = rgbOf(c).map(v => (v /= 255) <= 0.04045 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
// (the canvas colour is drawn in WebGL here, so it is passed in rather than read from #canvas)
function canvasEdge(colour) {
  const board = $('#board');
  const c = lum(colour), page = lum(getComputedStyle($('.stage')).backgroundColor);
  const close = (Math.max(c, page) + 0.05) / (Math.min(c, page) + 0.05) < 3;
  board.dataset.edge = close ? (c < 0.18 ? 'bright' : 'dark') : '';
}

// ---------- typed values
// Every value beside a slider or colour can be clicked (or tabbed to) and typed into. Enter or
// leaving it sets the value, Esc puts it back, ↑/↓ nudge by a step (⇧ by ten). A number past
// either end of the slider widens the slider to reach it.
function typein(el, { get, set, nudge }) {
  el.classList.add('typein'); el.tabIndex = 0; el.setAttribute('role', 'textbox');
  let before = null;
  const begin = () => {
    if (before !== null) return;
    before = el.textContent; el.textContent = get();
    el.contentEditable = 'plaintext-only'; el.classList.add('editing'); el.focus();
    getSelection().selectAllChildren(el);
  };
  const end = commit => {
    if (before === null) return;
    const text = el.textContent.trim();
    el.contentEditable = 'false'; el.classList.remove('editing'); el.textContent = before; before = null;
    if (commit) set(text);
  };
  el.addEventListener('focus', begin);
  el.addEventListener('click', begin);
  el.addEventListener('blur', () => end(true));
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    else if (e.key === 'Escape') { e.stopPropagation(); end(false); el.blur(); }
    else if (nudge && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
      e.preventDefault(); nudge((e.key === 'ArrowUp' ? 1 : -1) * (e.shiftKey ? 10 : 1));
      el.textContent = get(); getSelection().selectAllChildren(el);
    }
  });
}
const setRange = (r, n) => {
  if (!isFinite(n)) return;
  stopSweep(r);
  if (n < +r.min) r.min = n;
  if (n > +r.max) r.max = n;
  const step = +r.step || 0;
  if (step && Math.abs((n - r.min) / step - Math.round((n - r.min) / step)) > 1e-6) r.step = 'any';
  r.value = n; r.dispatchEvent(new Event('input'));
};
const hexIn = (inp) => typein(inp.closest('.cwrap').querySelector('.val'), {
  get: () => inp.value,
  set: text => {
    let h = text.trim().toLowerCase().replace(/^#?/, '#');
    if (/^#[0-9a-f]{3}$/.test(h)) h = '#' + [...h.slice(1)].map(c => c + c).join('');
    if (/^#[0-9a-f]{6}$/.test(h)) { inp.value = h; inp.dispatchEvent(new Event('input')); }
  },
});

// ---------- sweeps
// Every slider can run on its own: the round button beside its name opens a menu to bounce it
// from one end to the other and back, or loop it from start to end, through the chosen
// interpolation, with the chosen duration per sweep. It starts from where the slider is.
// Moving the slider by hand or typing its value stops it.
const EASE = {
  linear: x => x,
  inout: x => x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  in: x => x ** 3,
  out: x => 1 - (1 - x) ** 3,
  sine: x => (1 - Math.cos(Math.PI * x)) / 2,
};
const WAVE = {
  bounce: '<svg viewBox="0 0 13 8" aria-hidden="true"><path d="M1 6.5 4 1.5 7 6.5 10 1.5 12 4.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  loop: '<svg viewBox="0 0 13 8" aria-hidden="true"><path d="M1 6.5 6 1.5V6.5L11 1.5V6.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const sweeps = new Map();   // range → { mode: off | bounce | loop, ease, dur, p, btn }
let menu = null;
let current = null, raf = 0, last = 0;
// where in the sweep the slider is now: invert the easing at its position, by halving
function phaseOf(r, s) {
  const x = clamp((r.value - r.min) / (r.max - r.min), 0, 1), f = EASE[s.ease];
  let lo = 0, hi = 1;
  for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (f(m) < x) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
function showSweep(r) {
  const s = sweeps.get(r);
  s.btn.classList.toggle('on', s.mode !== 'off');
  s.btn.innerHTML = WAVE[s.mode === 'loop' ? 'loop' : 'bounce'];
  s.btn.setAttribute('aria-label', `${r.getAttribute('aria-label')}: ${s.mode === 'off' ? 'still' : s.mode}`);
  if (menu.matches(':popover-open') && current === r) $$('#sweepMode button').forEach(b => b.classList.toggle('on', b.dataset.mode === s.mode));
}
function setSweep(r, mode) {
  const s = sweeps.get(r);
  s.mode = mode;
  if (mode !== 'off') s.p = phaseOf(r, s);
  showSweep(r); run();
}
function stopSweep(r) { if (sweeps.has(r) && sweeps.get(r).mode !== 'off') setSweep(r, 'off'); }
const sweeping = (r) => !!sweeps.get(r) && sweeps.get(r).mode !== 'off';
function run() {
  if (raf || ![...sweeps.values()].some(s => s.mode !== 'off')) return;
  last = performance.now(); raf = requestAnimationFrame(tick);
}
function tick(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1); last = now;   // a frame's time can predate the start
  let any = false;
  for (const [r, s] of sweeps) {
    if (s.mode === 'off') continue;
    any = true;
    s.p += dt / s.dur;
    let u;
    if (s.mode === 'bounce') { s.p %= 2; u = s.p < 1 ? s.p : 2 - s.p; } else { s.p %= 1; u = s.p; }
    r.value = +r.min + (r.max - r.min) * EASE[s.ease](u);
    r.dispatchEvent(new Event('input'));
  }
  raf = any ? requestAnimationFrame(tick) : 0;
}
function openSweep(r) {
  const s = sweeps.get(r);
  current = r;
  $('#sweepName').textContent = r.getAttribute('aria-label');
  $('#sweepEase').value = s.ease; $('#sweepDur').value = s.dur;
  showChoice($('#sweepEase')); showChoice($('#sweepDur'));
  menu.showPopover(); showSweep(r);
  const b = s.btn.getBoundingClientRect(), m = menu.getBoundingClientRect();
  menu.style.left = `${clamp(b.left - 12, 8, innerWidth - m.width - 8)}px`;
  menu.style.top = `${b.bottom + 8 + m.height > innerHeight - 8 ? b.top - 8 - m.height : b.bottom + 8}px`;
}
// typed values and sweeps, attached to every slider row and colour well once the panels exist
function attachHouse() {
  menu = $('#sweep');
  $$('.row').forEach(row => {
    const r = row.querySelector('input[type=range]'), v = row.querySelector('.rowhead .val');
    if (!r || !v) return;
    typein(v, {
      get: () => String(+(+r.value).toFixed(3)),
      set: text => setRange(r, parseFloat(text.replace(',', '.'))),
      nudge: k => setRange(r, +(+r.value + k * (+r.step || (r.max - r.min) / 100)).toFixed(6)),
    });
  });
  $$('.well input').forEach(hexIn);
  $$('.row').forEach(row => {
    const r = row.querySelector('input[type=range]'), lab = row.querySelector('.rowhead > span:first-child');
    if (!r || !lab) return;
    const btn = document.createElement('button');
    btn.className = 'osc'; btn.title = 'Bounce or loop this slider';
    lab.classList.add('lab'); lab.append(btn);
    sweeps.set(r, { mode: 'off', ease: 'inout', dur: 2, p: 0, btn });
    showSweep(r);
    // a press on the button while its menu is open closes the menu (light dismiss); don't reopen it
    btn.addEventListener('pointerdown', () => btn.wasOpen = menu.matches(':popover-open') && current === r);
    btn.addEventListener('click', () => { if (!btn.wasOpen) openSweep(r); btn.wasOpen = false; });
    r.addEventListener('input', e => { if (e.isTrusted) stopSweep(r); });
  });
  $('#sweepMode').addEventListener('click', e => { const b = e.target.closest('button'); if (b && current) setSweep(current, b.dataset.mode); });
  $('#sweepEase').addEventListener('change', e => {
    const s = sweeps.get(current); s.ease = e.target.value;
    if (s.mode !== 'off') s.p = s.mode === 'bounce' && s.p >= 1 ? 2 - phaseOf(current, s) : phaseOf(current, s);
  });
  $('#sweepDur').addEventListener('change', e => { sweeps.get(current).dur = +e.target.value; });
  $$('#sweep .pwrap select').forEach(sel => { showChoice(sel); sel.addEventListener('change', () => showChoice(sel)); });
}

// ---------- saving
// Every export lands in the project, in a folder named for its type (png/, jpg/, svg/, mp4/ …),
// through serve.py's save endpoint, named for the app and the moment so nothing is overwritten.
// Opened any other way (a plain server, the file system), it falls back to a download.
const slug = () => (document.title || 'export').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const stamp = () => { const d = new Date(), p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`; };
async function saveFile(blob, name) {
  if (location.protocol.startsWith('http')) {
    try {
      const r = await fetch(`/__save/${encodeURIComponent(name)}`, { method: 'POST', headers: { 'X-Save': '1' }, body: blob });
      if (r.ok) { const { path } = await r.json(); toast(`Saved ${path}`); return path; }
    } catch {}
  }
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: name });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast(`Downloaded ${name} (run serve.py to save into the project)`);
}

// ---------- recording
// Record captures the canvas as video until it's pressed again, then saves it into mp4/ (or
// webm/ where the browser can't make mp4). A board drawn in canvases (one, or a WebGL scene with
// a 2D layer over it) is copied into the recording every frame, so a still canvas still records;
// any other board is captured from this tab, cropped to the board, which Chrome asks to share
// first.
const VIDEO = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
const rec = { r: null, t0: 0, timer: 0 };
function compositeStream(layers) {
  const out = document.createElement('canvas'), g = out.getContext('2d');
  let on = true;
  (function draw() {
    if (!on) return;
    const { width, height } = layers[0];
    if (out.width !== width || out.height !== height) { out.width = width; out.height = height; }
    g.clearRect(0, 0, width, height);
    for (const c of layers) if (c.width && c.height) g.drawImage(c, 0, 0, width, height);
    requestAnimationFrame(draw);
  })();
  return Object.assign(out.captureStream(60), { done: () => on = false });
}
async function boardStream() {
  const board = $('#board');
  const layers = [...board.querySelectorAll('canvas')];
  if (layers.length) return compositeStream(layers);
  if (!navigator.mediaDevices?.getDisplayMedia || !window.CropTarget) throw new Error('This browser can only record a <canvas> board');
  const s = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 60 }, audio: false, preferCurrentTab: true });
  await s.getVideoTracks()[0].cropTo(await CropTarget.fromElement(board));
  return s;
}
async function startRecording(name = slug()) {
  if (rec.r) return;
  if (!window.MediaRecorder) return toast('This browser can’t record', true);
  let stream;
  try { stream = await boardStream(); } catch (e) { return toast(e.message, true); }
  const type = VIDEO.find(t => MediaRecorder.isTypeSupported(t));
  const r = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 16e6 }), parts = [];
  r.ondataavailable = e => e.data.size && parts.push(e.data);
  r.onstop = () => {
    stream.done?.(); stream.getTracks().forEach(t => t.stop());
    if (!parts.length) return toast('Nothing was recorded', true);
    saveFile(new Blob(parts, { type: type.split(';')[0] }), `${name}-${stamp()}.${type.startsWith('video/mp4') ? 'mp4' : 'webm'}`);
  };
  stream.getVideoTracks()[0].addEventListener('ended', stopRecording);   // sharing stopped from the browser's own bar
  rec.r = r; rec.t0 = performance.now(); r.start(1000);
  showRec(); rec.timer = setInterval(showRec, 250);
}
function stopRecording() { if (!rec.r) return; rec.r.stop(); rec.r = null; clearInterval(rec.timer); showRec(); }
function showRec() {
  const b = $('#record'), s = Math.floor((performance.now() - rec.t0) / 1000);
  b.classList.toggle('rec', !!rec.r);
  b.textContent = rec.r ? `Stop ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : 'Record';
}

let toastT;
function toast(msg, err) {
  const el = $('#toast');
  el.textContent = msg; el.className = 'float show' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => el.className = 'float', 3600);
}

function buildUI(app) {
  const refreshers = [];
  let pending = null, bUndo = null, bRedo = null;
  const begin = () => { if (!pending) { pending = app.snapshot(); app.dragging = true; } };
  const commit = () => { if (pending) { app.history.push(pending); pending = null; } app.endDrag(); };

  const defaultOf = (path) => (path.startsWith('mat.')
    ? app.defaults.mat[app.settings.material]?.[path.slice(4)]
    : getPath(app.defaults, path));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const btn = (cls, label, title) => { const b = el('button', cls, label); b.type = 'button'; if (title) b.title = title; return b; };
  const showable = (node, it) => { if (it.show) refreshers.push(() => { node.hidden = !it.show(); }); return node; };
  const cols = { left: $('#colLeft'), right: $('#colRight') };

  for (const sec of sections(app)) {
    // every panel collapses from its head, and all start closed
    const box = el('section', 'panel');
    const head = btn('phead', `<span class="badge">${sec.badge}</span><span>${sec.title}</span>`);
    head.setAttribute('aria-expanded', 'false');
    head.addEventListener('click', () => head.setAttribute('aria-expanded', box.classList.toggle('open')));
    box.append(head);
    cols[sec.col].append(box);
    // menus and colours sit together in rows split by hairlines
    let rows = null;
    for (const it of sec.items) {
      const node = build(it);
      if (!node) continue;
      if (it.kind === 'popup' || it.kind === 'color') {
        if (!rows) { rows = el('div', 'rows'); rows.style.gap = '0'; box.append(rows); }
        rows.append(node);
      } else { rows = null; box.append(node); }
    }
  }

  function build(it) {
    switch (it.kind) {
      case 'range': return rangeCtl(it);
      case 'seg': return showable(segCtl(it), it);
      case 'popup': return showable(popupCtl(it), it);
      case 'color': return showable(colorCtl(it), it);
      case 'switch': return showable(switchCtl(it), it);
      case 'heatColors': return showable(heatColorsCtl(), it);
      case 'look': return lookCtl();
      case 'text': return textCtl();
      case 'face': return faceCtl();
      case 'margins': return rangeCtl({
        label: 'Margins', min: 0, max: 600, step: 1, unit: 'px', hint: 'All four margins together',
        get: () => app.settings.marginTop,
        set: (v) => ['marginTop', 'marginRight', 'marginBottom', 'marginLeft'].forEach(k => app.set(k, v, { history: false })),
        dflt: () => app.defaults.marginTop,
      });
      case 'presets': return presetsCtl();
      case 'congealBtns': return congealCtl();
      case 'dotBtns': return dotBtnsCtl();
      case 'actions': return actionsCtl();
      case 'settingsBtns': return settingsCtl();
      case 'note': return showable(el('div', 'note', it.html), it);
      default: return null;
    }
  }

  // a slider in its display units; the setting is the value divided by mult
  function rangeCtl(it) {
    const row = el('div', 'row');
    if (it.hint) row.title = it.hint;
    const head = el('div', 'rowhead');
    const v = el('span', 'val');
    if (it.unit) v.dataset.unit = it.unit;
    head.append(el('span', null, it.label), v);
    const r = el('input'); r.type = 'range'; r.setAttribute('aria-label', it.label);
    r.min = it.min; r.max = it.max; r.step = it.step;
    row.append(head, r);
    const mult = it.mult || 1;
    const get = it.get || (() => getPath(app.settings, it.path));
    const put = it.set || ((x) => app.set(it.path, x, { history: false }));
    r.addEventListener('input', (e) => {
      const x = +r.value / mult;
      // by hand: one undo step per drag; typed: one step each; swept: no undo steps at all
      if (e.isTrusted) { begin(); put(x); }
      else if (sweeping(r)) put(x);
      else { begin(); put(x); commit(); }
      fill(r);
    });
    r.addEventListener('change', commit);
    r.addEventListener('dblclick', () => {
      const d = it.dflt ? it.dflt() : defaultOf(it.path);
      if (d == null) return;
      stopSweep(r);
      begin(); put(d); commit(); refresh();
    });
    const refresh = () => {
      const x = get();
      if (typeof x === 'number' && Number.isFinite(x)) {
        const disp = x * mult;
        // a value typed past either end widened the slider; never squeeze it back
        if (disp < +r.min) r.min = disp;
        if (disp > +r.max) r.max = disp;
        if (Math.abs(+r.value - disp) > 1e-9) r.value = disp;
        fill(r);
      }
      if (it.show) row.hidden = !it.show();
    };
    refreshers.push(refresh);
    return row;
  }

  function segCtl(it) {
    const seg = el('div', 'seg');
    seg.setAttribute('role', 'group');
    if (it.hint) seg.title = it.hint;
    const btns = it.options.map(([v, t]) => {
      const b = btn(null, t);
      b.addEventListener('click', () => { app.set(it.path, v); refreshAll(); });
      seg.append(b);
      return [v, b];
    });
    refreshers.push(() => btns.forEach(([v, b]) => b.classList.toggle('on', getPath(app.settings, it.path) === v)));
    return seg;
  }

  function popupCtl(it) {
    const node = el('div', 'popup');
    if (it.hint) node.title = it.hint;
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', it.label);
    it.options.forEach(([v, t]) => sel.append(new Option(t, String(v))));
    const pw = el('span', 'pwrap');
    pw.append(el('span', 'pvalue'), sel);
    node.append(el('span', 'plabel', it.label), pw);
    sel.addEventListener('change', () => { app.set(it.path, it.number ? Number(sel.value) : sel.value); showChoice(sel); refreshAll(); });
    refreshers.push(() => { sel.value = String(getPath(app.settings, it.path)); showChoice(sel); });
    return node;
  }

  // the typeface: Interdot, the system faces, and any font opened from disk
  function faceCtl() {
    const wrap = el('div', 'rows');
    const node = el('div', 'popup');
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', 'Typeface');
    const pw = el('span', 'pwrap');
    pw.append(el('span', 'pvalue'), sel);
    node.append(el('span', 'plabel', 'Typeface'), pw);
    const fill = () => {
      sel.innerHTML = '';
      for (const [v, t] of [...FACES, ...app.fonts]) sel.append(new Option(t, v));
    };
    fill();
    sel.addEventListener('change', () => { app.set('font', sel.value); showChoice(sel); });
    const open = btn('btn', 'Open font…', 'Load a local .otf, .ttf, .woff or .woff2');
    const file = Object.assign(document.createElement('input'), { type: 'file', accept: '.otf,.ttf,.woff,.woff2' });
    open.addEventListener('click', () => file.click());
    file.addEventListener('change', async () => {
      const f = file.files[0]; if (!f) return;
      file.value = '';
      const name = f.name.replace(/\.[^.]+$/, ''), family = `user-${Date.now()}`;
      try {
        document.fonts.add(await new FontFace(family, await f.arrayBuffer()).load());
        app.fonts.push([`"${family}", sans-serif`, name]);
        fill();
        app.set('font', `"${family}", sans-serif`);
        refreshAll();
      } catch { toast(`Couldn't read ${f.name}`, true); }
    });
    const row = el('div', 'btnrow');
    row.append(open);
    wrap.append(node, row);
    refreshers.push(() => { sel.value = app.settings.font; showChoice(sel); });
    return wrap;
  }

  function colorCtl(it) {
    const node = el('div', 'colorrow');
    const cw = el('span', 'cwrap');
    const v = el('span', 'val');
    const well = el('label', 'well'), chip = el('span'), c = el('input');
    c.type = 'color'; c.id = it.id; c.setAttribute('aria-label', `${it.label} colour`);
    well.append(chip, c);
    cw.append(v, well);
    node.append(el('span', 'plabel', it.label), cw);
    c.addEventListener('input', (e) => {
      if (e.isTrusted) { begin(); app.set(it.path, c.value, { history: false }); }
      else { begin(); app.set(it.path, c.value, { history: false }); commit(); }
      show();
    });
    c.addEventListener('change', commit);
    const show = () => {
      const x = getPath(app.settings, it.path);
      if (typeof x !== 'string') return;
      if (c.value !== x) c.value = x;
      chip.style.background = x;
      if (!v.classList.contains('editing')) v.textContent = x;
      app.canvasEdge();
    };
    refreshers.push(show);
    return node;
  }

  function switchCtl(it) {
    const c = el('label', 'check');
    const t = el('span');
    t.append(document.createTextNode(it.label));
    if (it.sub) t.append(el('span', 'sub', it.sub));
    const inp = el('input'); inp.type = 'checkbox'; inp.setAttribute('role', 'switch');
    c.append(t, inp, el('span', 'box'));
    inp.addEventListener('change', () => { app.set(it.path, inp.checked); refreshAll(); });
    refreshers.push(() => { inp.checked = !!getPath(app.settings, it.path); });
    return c;
  }

  function textCtl() {
    const ta = el('textarea', 'field');
    ta.spellcheck = false;
    ta.setAttribute('aria-label', 'Text');
    ta.placeholder = 'Type here, or click the canvas';
    ta.addEventListener('input', () => app.setText(ta.value));
    refreshers.push(() => { if (document.activeElement !== ta && ta.value !== app.text.text) ta.value = app.text.text; });
    return ta;
  }

  // the material: sweat or ink colours, or the heat map
  function lookCtl() {
    const seg = el('div', 'seg');
    seg.setAttribute('role', 'group');
    const opts = [['sweat', 'Sweat'], ['ink', 'Ink'], ['heat', 'Heatmap']];
    const cur = () => (app.settings.heat.on ? 'heat' : app.settings.material);
    const btns = opts.map(([v, t]) => {
      const b = btn(null, t);
      b.addEventListener('click', () => {
        const before = app.snapshot();
        if (v === 'heat') app.set('heat.on', true, { history: false });
        else { app.set('heat.on', false, { history: false }); app.set('material', v, { history: false }); }
        app.history.push(before);
        refreshAll();
      });
      seg.append(b);
      return [v, b];
    });
    refreshers.push(() => btns.forEach(([v, b]) => b.classList.toggle('on', cur() === v)));
    return seg;
  }

  // the heat map's colours, centre first: recolour, reorder, remove or add (up to eight)
  function heatColorsCtl() {
    const wrap = el('div', 'rows');
    const list = el('div', 'rows');
    list.style.gap = '0';
    const tools = el('div', 'btnrow');
    const add = btn('btn', 'Add colour'), rev = btn('btn', 'Reverse'), reset = btn('btn', 'Reset');
    tools.append(add, rev, reset);
    wrap.append(list, tools);
    const cols = () => app.settings.heat.colors;
    const put = (c) => { app.set('heat.colors', c); draw(); };
    add.addEventListener('click', () => { const c = cols(); if (c.length < 8) put([...c, c[c.length - 1] || '#ffffff']); });
    rev.addEventListener('click', () => put([...cols()].reverse()));
    reset.addEventListener('click', () => put(clone(app.defaults.heat.colors)));
    let sig = null;
    function draw() {
      const c = cols();
      sig = c.join();
      list.innerHTML = '';
      c.forEach((hex, i) => {
        const row = el('div', 'colorrow');
        const lab = el('span', 'plabel', i === 0 ? 'Centre' : i === c.length - 1 ? 'Outside' : `Band ${i}`);
        const cw = el('span', 'cwrap');
        const v = el('span', 'val', hex);
        const well = el('label', 'well'), chip = el('span'), inp = el('input');
        inp.type = 'color'; inp.value = hex; chip.style.background = hex;

          sig = n.join();

        });
        inp.addEventListener('change', commit);
        const up = btn('mini', '↑', 'Move toward the centre'), dn = btn('mini', '↓', 'Move outward'), x = btn('mini', '×', 'Remove');
        up.disabled = i === 0; dn.disabled = i === c.length - 1; x.disabled = c.length <= 2;
        const swap = (j) => { const n = [...cols()]; [n[i], n[j]] = [n[j], n[i]]; put(n); };
        up.addEventListener('click', () => swap(i - 1));
        dn.addEventListener('click', () => swap(i + 1));
        x.addEventListener('click', () => put(cols().filter((_, k) => k !== i)));
        cw.append(v, well, up, dn, x);
        row.append(lab, cw);
        list.append(row);
        hexIn(inp);
      });
      add.disabled = c.length >= 8;
      app.canvasEdge();
    }

  }

  // each preset is one undo step
  function presetsCtl() {
    const chips = el('div', 'chips');
    for (const p of PRESETS) {
      const b = btn('chip', p.name, p.hint);
      b.addEventListener('click', () => {
        const before = app.snapshot();
        const patch = p.patch();
        for (const k in patch) app.set(k, patch[k], { history: false });
        app.history.push(before);
        toast(p.name);
        refreshAll();
      });
      chips.append(b);
    }

  }

  function congealCtl() {
    const row = el('div', 'btnrow');
    const rnd = btn('btn primary', 'Random', 'Congeal a new random selection of dots (G)');
    const again = btn('btn', 'Restart', 'Dry everything and congeal the same selection again (R)');
    rnd.addEventListener('click', () => app.randomize());
    again.addEventListener('click', () => app.restart(true));
    row.append(rnd, again);
