  }

  function dotBtnsCtl() {
    const row = el('div', 'btnrow');
    const clr = btn('btn', 'Clear placed dots');
    clr.addEventListener('click', () => {
      if (!app.settings.placed.length) { toast('No placed dots'); return; }
      app.set('placed', []);
      refreshAll();
    });
    row.append(clr);
    refreshers.push(() => { clr.disabled = !app.settings.placed.length; });
    return row;
  }

  function actionsCtl() {
    const row = el('div', 'btnrow');
    const png = btn('btn', 'Export PNG');
    png.addEventListener('click', () => app.exportPNG());
    const svg = btn('btn', 'Export SVG', 'The dots and congealed shapes as vectors (a heat map goes in as an image)');
    svg.addEventListener('click', () => app.exportSVG());
    row.append(png, svg);
    return row;
  }

  function settingsCtl() {
    const row = el('div', 'btnrow');
    bUndo = btn('btn', 'Undo', 'Undo (Ctrl or Cmd + Z)');
    bRedo = btn('btn', 'Redo', 'Redo (Shift + Ctrl or Cmd + Z)');
    const reset = btn('btn', 'Defaults', 'Start again with the settings as they came');
    bUndo.addEventListener('click', () => app.undo());
    bRedo.addEventListener('click', () => app.redo());
    reset.addEventListener('click', () => {
      app.history.push(app.snapshot());
      const d = clone(app.defaults);
      d.placed = clone(app.settings.placed);
      app.applySnapshot({ settings: d, text: app.text.snapshot(), caret: app.caret });
    });
    row.append(bUndo, bRedo, reset);
    return row;
  }
  app.history.onChange = () => { bUndo.disabled = !app.history.canUndo; bRedo.disabled = !app.history.canRedo; };
  app.history.onChange();

  // the top bar
  const bPause = $('#pause');
  bPause.addEventListener('click', () => app.togglePause());
  $('#dryall').addEventListener('click', () => app.dryAll());
  const bCursor = $('#hidecursor');
  bCursor.addEventListener('click', () => { app.set('hideCursor', !app.settings.hideCursor); refreshAll(); });
  $('#record').addEventListener('click', () => rec.r ? stopRecording() : startRecording());
  $('[data-hide-ui]').addEventListener('click', () => app.setUiHidden(true));
  $('#showUi').addEventListener('click', () => app.setUiHidden(false));
  $('#fullscreen').addEventListener('click', () => app.toggleFullscreen());

  // typed values and sweeps on every slider and colour built above
  attachHouse();

  const hudEl = $('#hud');
  function refreshAll() {
    refreshers.forEach(f => f());
    bPause.textContent = app.paused ? 'Resume' : 'Pause';
    bPause.classList.toggle('on', app.paused);
    bCursor.textContent = app.settings.hideCursor ? 'Show cursor' : 'Hide cursor';
    bCursor.classList.toggle('on', !!app.settings.hideCursor);
    app.board.classList.toggle('tool-dots', app.settings.tool === 'dots');
    app.board.classList.toggle('tool-wipe', app.settings.tool === 'wipe');
    app.board.classList.toggle('nocursor', !!app.settings.hideCursor);
    app.canvasEdge();
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => app.canvasEdge());

  return {
    refresh: refreshAll,
    tick() {},
    hud() {
      const total = app.dots?.length || 0;
      const wet = app.dots ? app.dots.reduce((n, d) => n + (d.liquid ? 1 : 0), 0) : 0;
      const name = app.settings.heat.on ? 'Heatmap' : MATERIALS[app.settings.material].name;
      hudEl.innerHTML = total
        ? `<b>${name}</b> · ${total} dots · ${wet} congealed${app.paused ? ' · <b>paused</b>' : ''}`
        : `<b>${name}</b> · click the canvas and type`;
    },
  };
}

function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }


// ---- js/main.js
// sweat: dot type whose dots turn to liquid and congeal into beads
class App {
  constructor() {
    this.settings = defaultSettings();
    this.defaults = defaultSettings();
    this.text = new TextModel('');
    this.fonts = [];             // faces opened from disk: [css family, name]
    this.history = new History();
    this.frameCount = 0;
    this.paused = false;
    this.pointer = { inside: false, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, down: null, seen: false };
    this.caret = 0;
    this.focused = false;
    this.dirty = { layout: false, alloc: false, env: false, congeal: false };
    this.lastTime = performance.now();
    this.fps = 60;
    this.exportRequest = null;
    this.liquid = new Set();     // keys of dots that have turned to liquid
    this.geo = new Map();        // geometric mode: hover offset and growth per congealed dot
    this.beads = new Map();      // surface tension: id -> where the cursor first gathered that bead
    this.seen = new Set();       // glyph ids that have already had their share congealed
    this.injectQueue = [];
    this.dots = [];
    this.staticGen = 0;
    this.image = null;
  }

  async init() {
    const q = new URLSearchParams(location.search);
    if (q.has('sim')) { this.settings.perf.simRes = Number(q.get('sim')); this.noAuto = true; }
    if (q.has('rs')) this.settings.perf.renderScale = Number(q.get('rs'));
    if (q.has('mat') && PER_MATERIAL[q.get('mat')]) this.settings.material = q.get('mat');
    if (q.has('text')) this.text.replaceAll(q.get('text'));
    this.reducedMotion = !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    this.canvas = document.getElementById('gl');
    this.overlay = document.getElementById('overlay');
    this.board = document.getElementById('board');
    this.stage = document.getElementById('stage');
    this.ta = document.getElementById('typing');
    try {
      this.kit = new GLKit(this.canvas);
    } catch (e) {
      this.fatal(e.message);
      return;
    }
    this.setter = new DotSetter();
    this.sim = new Simulation(this.kit);
    this.renderer = new Renderer(this.kit);
    this.ui = buildUI(this);
    this.bindInput();
    this.fitBoard();
    this.allocSim();
    this.rebuildLayout();
    this.restart(false);
    this.renderer.buildEnv(this.settings);
    this.ta.value = this.text.text;
    this.canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.fatal('The GPU context was lost. Reload the page to continue.'); });
    new ResizeObserver(() => this.fitBoard()).observe(this.board);
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && this.fsHid) { this.fsHid = false; this.setUiHidden(false); }
    });
    this.ui.refresh();
    requestAnimationFrame((t) => this.loop(t));
    window.sweat = this; // console / test access
  }

  fatal(msg) {
    const el = document.getElementById('fatal');
    if (el) { el.textContent = msg; el.hidden = false; el.style.opacity = 1; }
    console.error(msg);
  }

  get art() { return artboardSize(this.settings); }
  get mat() { return MATERIALS[this.settings.material]; }
  get matSettings() { return this.settings.mat[this.settings.material]; }

  // ------------------------------------------------------------ state + history
  snapshot() { return { settings: clone(this.settings), text: this.text.snapshot(), caret: this.caret }; }

  applySnapshot(snap) {
    const prev = this.settings;
    this.settings = clone(snap.settings);
    for (const p of OSC_PATHS) {
      if (getPath(prev, 'osc.' + p)?.on && getPath(this.settings, 'osc.' + p)?.on) setPath(this.settings, p, getPath(prev, p));
    }
    const changed = diffPaths(prev, this.settings);
    const textChanged = snap.text.text !== this.text.text || snap.text.ids.join() !== this.text.ids.join();
    this.text.restore(snap.text);
    this.ta.value = this.text.text;
    this.caret = Math.min(snap.caret ?? this.text.text.length, this.text.text.length);
    try { this.ta.setSelectionRange(this.caret, this.caret); } catch (_) { /* hidden */ }
    this.markEffects(changed, textChanged);
    this.ui?.refresh();
  }

  undo() {
    const s = this.history.undo(this.snapshot());
    if (s) this.applySnapshot(s);
  }

  redo() {
    const s = this.history.redo(this.snapshot());
    if (s) this.applySnapshot(s);
  }

  set(path, value, opts = {}) {
    const before = opts.history !== false ? this.snapshot() : null;
    const old = getPath(this.settings, path);
    if (old === value) return;
    setPath(this.settings, path, value);
    if (path === 'cursorRadius') this.ringUntil = performance.now() + 1200;
    if (before) this.history.push(before, opts.mergeKey || null);
    this.markEffects([path]);
  }

  markEffects(paths, textChanged = false) {
    for (const p of paths) {
      if (EFFECTS.reset.has(p)) { this.dirty.alloc = true; }
      if (EFFECTS.layout.has(p) || p.startsWith('placed')) this.dirty.layout = true;
      if (EFFECTS.env.has(p)) this.dirty.env = true;
      if (EFFECTS.congeal.has(p)) this.dirty.congeal = true;
      if (EFFECTS.dots.has(p)) this.renderer.dotsDirty = true;
      if (EFFECTS.union.has(p)) this.staticDirty = true;
      if (p === 'heat.on') this.dirty.layout = true;
      if (p === 'aspect') this.fitBoard();
      if (p === 'perf.renderScale') this.fitBoard();
      if (p === 'tool') this.ui?.refresh();
    }
    if (textChanged) this.dirty.layout = true;
  }

  // ------------------------------------------------------------ geometry
  // the board is sized by CSS to the open canvas at the artboard's ratio; the canvases follow it
  fitBoard() {
    if (!this.board) return;
    const [aw, ah] = this.art;
    this.board.style.setProperty('--r', aw / ah);
    const q = this.board.getBoundingClientRect();
    const cw = Math.max(1, Math.round(q.width)), ch = Math.max(1, Math.round(q.height));
    const dpr = Math.min(window.devicePixelRatio || 1, 2) * this.settings.perf.renderScale;
    const pw = Math.max(64, Math.min(3840, Math.round(cw * dpr)));
    const ph = Math.max(64, Math.round(pw * ah / aw));
    if (this.canvas.width !== pw || this.canvas.height !== ph) {
      this.canvas.width = pw; this.canvas.height = ph;
    }
    const odpr = Math.min(window.devicePixelRatio || 1, 2);
    this.overlay.width = Math.round(cw * odpr); this.overlay.height = Math.round(ch * odpr);
    this.overlayScale = odpr;
    this.renderer?.resize(pw, ph);
  }

  simDims() {
    const [aw, ah] = this.art;
    const n = this.settings.perf.simRes;
    if (aw >= ah) return [n, Math.max(8, Math.round(n * ah / aw))];
    return [Math.max(8, Math.round(n * aw / ah)), n];
  }

  get physWidth() { return this.settings.scale / 100; }

  allocSim() {
    const [nx, ny] = this.simDims();
    this.sim.allocate(nx, ny);
    this.dx = this.physWidth / nx;
    this.sim.dx = this.dx;
    const [aw] = this.art;
    this.mToPx = aw / this.physWidth;
    this.pxMm = this.physWidth * 1000 / aw;
  }

  // ------------------------------------------------------------ layout + dots
  rebuildLayout() {
    const s = this.settings;
    const [aw, ah] = this.art;
    const lay = this.setter.layout(this.text.text, this.text.ids, s, { w: aw, h: ah });
    this.layout = lay;
    this.ui?.refresh();
    this.buildDots();
    // newly typed letters sweat their share straight away
    const fresh = lay.glyphs.filter(g => !this.seen.has(g.id));
    if (fresh.length) {
      for (const g of fresh) { this.seen.add(g.id); this.congealGroup(this.dots.filter(d => d.gid === g.id), hash2(s.seed, g.id)); }
      this.sim.uploadGather();
    }
  }

  // every dot on the artboard: glyph dots (keyed by glyph id + index) then placed dots (keyed by -id)
  buildDots() {
    const lay = this.layout;
    const r = lay.r;
    const dots = [];
    const geo = this.geometric, heat = !!this.settings.heat.on;
    const mk = (o, h) => ({ ...o, geo, heat, sp: h & 3, liquid: this.liquid.has(o.key) });
    for (const g of lay.glyphs) {
      g.dots.forEach(([x, y], j) => {
        const key = g.id * 1024 + j;
        dots.push(mk({ key, gid: g.id, x, y, r: g.r }, hash2(key, 99)));
      });
    }
    for (const p of this.settings.placed) {
      const key = -p.id;
      dots.push(mk({ key, gid: -1, x: p.x, y: p.y, r }, hash2(p.id, 7)));
    }
    this.heatMode = heat ? 'all' : 'none';
    this.dots = dots;
    this.dotByKey = new Map(dots.map(d => [d.key, d]));
    this.staticDirty = true;
  }

  uploadStatic() {
    const [, ah] = this.art;
    const list = this.dots.filter(d => !d.liquid);
    const data = new Float32Array(Math.max(1, list.length) * 4);
    list.forEach((d, i) => data.set([d.x, ah - d.y, d.r, 0], i * 4));
    this.renderer.setDots(data, list.length);
    const hl = list.filter(d => d.heat);
    const hdata = new Float32Array(Math.max(1, hl.length) * 4);
    hl.forEach((d, i) => hdata.set([d.x, ah - d.y, d.r, 0], i * 4));
    this.renderer.setHeatDots(hdata, hl.length);
    this.uploadUnion();
    this.staticList = list;
    this.staticGen++;
    this.staticDirty = false;
  }

  toCells(x, y) {
    const [aw, ah] = this.art;
    return [x / aw * this.sim.nx, (1 - y / ah) * this.sim.ny];
  }

  get geometric() { return this.settings.congealStyle === 'geometric'; }

  liquefy(d) {
    if (d.liquid) return;
    d.liquid = true;
    this.liquid.add(d.key);
    // geometric congealing is drawn, not simulated: no liquid goes into the sim
    if (!d.geo) {
      const [cx, cy] = this.toCells(d.x, d.y);
      this.injectQueue.push([cx, cy, d.r / this.art[0] * this.sim.nx, d.sp]);
    }
    this.staticDirty = true;
  }

  // the bead a freshly touched dot joins: one gathered near both it and the cursor, else a new one
  beadFor(d, p, R) {
    let best = 0, bd = Infinity;
    for (const [id, b] of this.beads) {
      const e = Math.hypot(d.x - b.x, d.y - b.y);
      if (e < R && e < bd && Math.hypot(p.x - b.x, p.y - b.y) < R) { best = id; bd = e; }
    }
    if (best) return best;
    const id = this.beads.size + 1;
    this.beads.set(id, { x: p.x, y: p.y });
    return id;
  }

  // Pathfinder-style union of the congealed dots: each dot, plus a straight bridge to every other
  // congealed dot within reach (in dot spacings)
  uploadUnion() {
    const [, ah] = this.art;
    const s = this.settings;
    // each congealed dot where the hover has moved and grown it to
    const wet = this.dots.filter(d => d.liquid && d.geo).map(d => {
      const g = this.geo.get(d.key);
      return g ? { x: d.x + g.ox, y: d.y + g.oy, r: d.r * g.s, heat: d.heat, x0: d.x, y0: d.y, bead: g.bead, m: g.m || 0 } : { ...d, x0: d.x, y0: d.y };
    });
    // surface tension: each bead's dots run toward their shared centre and swell, keeping their area,
    // until at full strength they are one round bead
    const beads = new Map();
    for (const d of wet) if (d.bead && d.m > 0.01) {
      if (!beads.has(d.bead)) beads.set(d.bead, []);
      beads.get(d.bead).push(d);
    }
    for (const ms of beads.values()) {
      let A = 0, cx = 0, cy = 0;
      for (const d of ms) { const a = d.r * d.r; A += a; cx += d.x * a; cy += d.y * a; }
      cx /= A; cy /= A;
      const R = Math.sqrt(A);
      for (const d of ms) { d.x += (cx - d.x) * d.m; d.y += (cy - d.y) * d.m; d.r += (R - d.r) * d.m; }
    }
    const inBead = (d) => d.bead && d.m > 0.01 && beads.get(d.bead).length > 1;
    const hot = [], pairs = [];
    const n = wet.length;
    const dots = new Float32Array(Math.max(1, n) * 8);
    wet.forEach((d, i) => dots.set([d.x, ah - d.y, d.x, ah - d.y, d.r, d.r, 0, 0], i * 8));
    // reach grows with the dots: two dots swollen to 1.3× reach 1.3× as far
    const r0 = this.layout.r, pitch = this.layout.pitch, base = s.reach * pitch * 1.001;
    const grid = s.bridgeMode === 'grid';
    const reachOf = (a, b) => base * (a.r + b.r) / (2 * r0);
    const reach = base * wet.reduce((m, d) => Math.max(m, d.r / r0), 1);
    const out = [];
    if (reach > 0) {
      // bucket by reach so only nearby pairs are compared
      const cell = new Map();
      const key = (x, y) => x + ',' + y;
      wet.forEach((d, i) => {
        const k = key(Math.floor(d.x / reach), Math.floor(d.y / reach));
        if (!cell.has(k)) cell.set(k, []);
        cell.get(k).push(i);
      });
      wet.forEach((a, i) => {
        const cx = Math.floor(a.x / reach), cy = Math.floor(a.y / reach);
        for (let gy = cy - 1; gy <= cy + 1; gy++) for (let gx = cx - 1; gx <= cx + 1; gx++) {
          for (const j of cell.get(key(gx, gy)) || []) {
            if (j <= i) continue;
            const b = wet[j];
            // a bead holds together on its own and lets go of the dots around it
            if (inBead(a) || inBead(b)) continue;
            if (Math.hypot(a.x - b.x, a.y - b.y) > reachOf(a, b)) continue;
            // neighbours only: straight up, down or across on the type's grid, and no further than the next dot
            if (grid) {
              const gx = Math.abs(a.x0 - b.x0), gy = Math.abs(a.y0 - b.y0);
              if (Math.min(gx, gy) > 0.25 * pitch || Math.max(gx, gy) > 1.15 * pitch) continue;
            }
            out.push(a.x, ah - a.y, b.x, ah - b.y, a.r, b.r, 0, 0);
            pairs.push([a, b]);
            if (a.heat && b.heat) hot.push(a.x, ah - a.y, b.x, ah - b.y, a.r, b.r, 0, 0);
          }
        }
      });
    }
    for (const ms of beads.values()) for (let i = 0; i < ms.length; i++) for (let j = i + 1; j < ms.length; j++) {
      const a = ms[i], b = ms[j];
      if (Math.hypot(a.x - b.x, a.y - b.y) < 0.5) continue;   // already run together
      out.push(a.x, ah - a.y, b.x, ah - b.y, a.r, b.r, 0, 0);
      pairs.push([a, b]);
      if (a.heat && b.heat) hot.push(a.x, ah - a.y, b.x, ah - b.y, a.r, b.r, 0, 0);
    }
    this.renderer.setUnion(dots, n, new Float32Array(out.length ? out : new Array(8).fill(0)), out.length / 8, s.bridge);
    this.unionGeom = { wet, pairs };   // kept for SVG export, in artboard px
    // the same shapes again, only those of heat-map lines, for the heat map's own mask
    const hw = wet.filter(d => d.heat);
    const hd = new Float32Array(Math.max(1, hw.length) * 8);
    hw.forEach((d, i) => hd.set([d.x, ah - d.y, d.x, ah - d.y, d.r, d.r, 0, 0], i * 8));
    this.renderer.setHeatUnion(hd, hw.length, new Float32Array(hot.length ? hot : new Array(8).fill(0)), hot.length / 8);
  }

  // turn a share of one letterform's dots to liquid, in random clusters that gather into beads
  congealGroup(dots, seed) {
    const s = this.settings;
    const rng = mulberry32(seed);
    const N = dots.length;
    if (!N || s.amount <= 0) return;
    const want = Math.min(N, Math.floor(s.amount * N + rng()));
    if (!want) return;
    const pitch = this.layout.pitch;
    const near = dots.map((a) => dots.map((b, j) => (a !== b && Math.hypot(a.x - b.x, a.y - b.y) < pitch * 1.5 ? j : -1)).filter(j => j >= 0));
    const taken = new Uint8Array(N);
    if (s.pattern === 'runs') { this.congealRuns(dots, rng, near, want); return; }
    const cellPerPx = this.sim.nx / this.art[0];
    let count = 0, guard = 0;
    while (count < want && guard++ < N * 4) {
      const free = [];
      for (let i = 0; i < N; i++) if (!taken[i]) free.push(i);
      if (!free.length) break;
      const seedI = free[Math.floor(rng() * free.length)];
      const size = Math.min(want - count, Math.max(1, Math.round(s.beadSize * (1 - s.variation * rng()))));
      const cluster = [seedI];
      taken[seedI] = 1;
      const frontier = new Set(near[seedI].filter(j => !taken[j]));
      while (cluster.length < size && frontier.size) {
        const arr = [...frontier];
        const j = arr[Math.floor(rng() * arr.length)];
        frontier.delete(j);
        if (taken[j]) continue;
        taken[j] = 1;
        cluster.push(j);
        near[j].forEach(q => { if (!taken[q]) frontier.add(q); });
      }
      count += cluster.length;
      // degree 1 pulls the whole cluster into a single bead, lower degrees only partway
      const degree = 1 - s.variation * rng() * 0.75;
      const delay = rng() * s.variation * 0.9;
      if (cluster.length > 1) {
        let mx = 0, my = 0;
        cluster.forEach(i => { mx += dots[i].x; my += dots[i].y; });
        mx /= cluster.length; my /= cluster.length;
        const strength = 55 * (0.55 + 0.45 * degree);
        for (const i of cluster) {
          const d = dots[i];
          const [ax, ay] = this.toCells(d.x, d.y);
          const [bx, by] = this.toCells(d.x + (mx - d.x) * degree, d.y + (my - d.y) * degree);
          this.sim.paintGather(ax, ay, bx, by, d.r * cellPerPx * 1.35 + 1.5, strength, this.sim.simTime + delay);
        }
      }
      cluster.forEach(i => this.liquefy(dots[i]));
    }
  }

  // swelling runs: walk along the stroke from a random dot, keeping as straight a line as the letter
  // allows, and make each dot a little bigger than the last (or swell toward the middle of the run)
  congealRuns(dots, rng, near, want) {
    const s = this.settings, pitch = this.layout.pitch;
    const N = dots.length, taken = new Uint8Array(N);
    let count = 0, guard = 0;
    while (count < want && guard++ < N * 4) {
      const free = [];
      for (let i = 0; i < N; i++) if (!taken[i]) free.push(i);
      if (!free.length) break;
      // every run is the full length: when one end runs out of free dots it grows from the other
      const len = Math.max(2, Math.round(s.runLength));
      const path = [free[Math.floor(rng() * free.length)]];
      taken[path[0]] = 1;
      const step = (from, dir) => {
        const a = dots[from];
        let best = -1, bs = Infinity;
        for (const j of near[from]) {
          if (taken[j]) continue;
          const b = dots[j], dx = b.x - a.x, dy = b.y - a.y, dl = Math.hypot(dx, dy);
          // nearest first, then the straightest continuation of the run so far
          const turn = dir ? 1 - (dx * dir[0] + dy * dir[1]) / dl : 0;
          const sc = dl / pitch + 0.9 * turn + 0.15 * rng();
          if (sc < bs) { bs = sc; best = j; }
        }
        return best;
      };
      const dirOf = (p, q) => { const dx = dots[q].x - dots[p].x, dy = dots[q].y - dots[p].y, l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
      let tailOpen = true, headOpen = true;
      while (path.length < len && (tailOpen || headOpen)) {
        if (tailOpen) {
          const n1 = path.length;
          const j = step(path[n1 - 1], n1 > 1 ? dirOf(path[n1 - 2], path[n1 - 1]) : null);
          if (j < 0) tailOpen = false; else { taken[j] = 1; path.push(j); continue; }
        }
        if (headOpen) {
          const j = step(path[0], path.length > 1 ? dirOf(path[1], path[0]) : null);
          if (j < 0) headOpen = false; else { taken[j] = 1; path.unshift(j); }
        }
      }
      count += path.length;
      const rate = Math.max(0, s.growth * (1 + s.variation * (rng() - 0.5)));
      const n = path.length;
      path.forEach((idx, i) => {
        const d = dots[idx];
        // exponential: each step multiplies the size by (1 + rate), so the peak stands well clear of
        // its neighbours. ramp: bigger dot by dot; swell: biggest in the middle; both: the two together
        const sw = Math.min(i, n - 1 - i);
        const steps = s.runShape === 'swell' ? sw : s.runShape === 'both' ? i + sw : i;
        const k = Math.pow(1 + rate, steps);
        this.liquefy(d);
        this.geo.set(d.key, { s: k, base: k, ox: 0, oy: 0, w: 0, px: d.x, py: d.y });
      });
    }
  }

  // dry everything, then congeal every letterform (and the placed dots) from the current seed
  restart(toast) {
    this.geo.clear();
    this.beads.clear();
    this.sim.clear();
    this.liquid.clear();
    this.injectQueue.length = 0;
    this.seen.clear();
    this.buildDots();
    const s = this.settings;
    for (const g of this.layout.glyphs) {
      this.seen.add(g.id);
      this.congealGroup(this.dots.filter(d => d.gid === g.id), hash2(s.seed, g.id));
    }
    const placed = this.dots.filter(d => d.gid === -1);
    if (placed.length) this.congealGroup(placed, hash2(s.seed, 0x5eed));
    this.sim.uploadGather();
    this.dirty.congeal = false;
    if (toast) this.toast('Restarted');
  }

  randomize() {
    this.set('seed', (Math.random() * 1e9) | 0);
    this.restart(false);
    this.toast('Random congeal');
    this.ui?.refresh();
  }

  dryAll() {
    this.geo.clear();
    this.beads.clear();
    this.sim.clear();
    this.liquid.clear();
    this.injectQueue.length = 0;
    this.buildDots();
    this.toast('Dried');
  }

  // ------------------------------------------------------------ background image
  async loadImage(file) {
    try {
      const bmp = await createImageBitmap(file);
      const max = Math.min(4096, this.kit.gl.getParameter(this.kit.gl.MAX_TEXTURE_SIZE));
      const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(bmp.width * sc)); cv.height = Math.max(1, Math.round(bmp.height * sc));
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const th = document.createElement('canvas');
      th.width = 80; th.height = Math.max(1, Math.round(80 * cv.height / cv.width));
      th.getContext('2d').drawImage(cv, 0, 0, th.width, th.height);
      const px = th.getContext('2d').getImageData(0, 0, th.width, th.height).data;
      const sum = [0, 0, 0];
      for (let i = 0; i < px.length; i += 4) for (let c = 0; c < 3; c++) sum[c] += px[i + c];
      const avg = '#' + sum.map(v => Math.round(v / (px.length / 4)).toString(16).padStart(2, '0')).join('');
      this.setImage({ canvas: cv, name: file.name || 'image', thumb: th.toDataURL('image/jpeg', 0.7), w: cv.width, h: cv.height, avg });
    } catch (e) {
      this.toast('Could not read that image');
    }
  }

  setImage(img) {
    this.image = img;
    this.renderer.setImage(img ? img.canvas : null);
    this.dirty.env = true;
    this.ui?.refresh();
    if (img) this.toast('Surface image loaded');
  }

  imageXf() {
    if (!this.image) return [1, 1, 0, 0];
    const [aw, ah] = this.art;
    const a = aw / ah, b = this.image.w / this.image.h;
    const im = this.settings.image;
    let sx, sy;
    if ((im.fit === 'contain') === (b > a)) { sx = 1; sy = b / a; } else { sx = a / b; sy = 1; }
    const z = Math.max(im.zoom, 0.01);
    return [sx / z, sy / z, -im.x * 0.5, im.y * 0.5];
  }

  // ------------------------------------------------------------ input
  bindInput() {
    const b = this.board;
    const toArt = (e) => {
      const r = b.getBoundingClientRect();
      const [aw, ah] = this.art;
      return [(e.clientX - r.left) / r.width * aw, (e.clientY - r.top) / r.height * ah];
    };
    const hint = document.getElementById('hint');
    let hintArmed = false;
    const dismissHint = () => { if (hintArmed || !hint) return; hintArmed = true; setTimeout(() => hint.classList.add('gone'), 2500); };
    const enter = (e) => {
      this.pointer.inside = true;
      [this.pointer.x, this.pointer.y] = toArt(e);
      if (!this.pointer.seen) { this.pointer.px = this.pointer.x; this.pointer.py = this.pointer.y; this.pointer.seen = true; }
    };
    b.addEventListener('pointerenter', enter);
    b.addEventListener('pointerleave', () => { this.pointer.inside = false; });
    b.addEventListener('pointermove', (e) => {
      dismissHint();
      enter(e);
      if (this.pointer.down && this.settings.tool === 'dots') this.dragDots(e.altKey);
    });
    b.addEventListener('pointerdown', (e) => {
      const [x, y] = toArt(e);
      this.pointer.x = x; this.pointer.y = y; this.pointer.inside = true;
      if (e.pointerType === 'touch') { this.pointer.px = x; this.pointer.py = y; }
      this.pointer.down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      b.setPointerCapture?.(e.pointerId);
      if (this.settings.tool === 'dots') {
        this.dotGesture = this.snapshot();
        this.lastDot = null;
        this.dragDots(e.altKey);
      }
      e.preventDefault();
    });
    const up = (e) => {
      const d = this.pointer.down;
      this.pointer.down = null;
      if (e.pointerType === 'touch') this.pointer.inside = false;
      if (this.dotGesture) {
        if (JSON.stringify(this.dotGesture.settings.placed) !== JSON.stringify(this.settings.placed)) this.history.push(this.dotGesture);
        this.dotGesture = null;
        this.ui?.refresh();
        return;
      }
      if (!d || this.settings.tool !== 'congeal') return;
      // a click or tap (not a drag) places the text caret
      const moved = Math.hypot(e.clientX - d.x, e.clientY - d.y);
      if (moved > 8 || (e.pointerType !== 'mouse' && performance.now() - d.t > 350)) return;
      const [x, y] = toArt(e);
      this.caret = this.setter.hitTest(this.layout, x, y);
      this.ta.focus({ preventScroll: true });
      this.ta.setSelectionRange(this.caret, this.caret);
      this.history.breakMerge();
    };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', () => { this.pointer.down = null; this.pointer.inside = false; this.dotGesture = null; });
    this.ta.addEventListener('focus', () => { this.focused = true; this.board.classList.add('typing'); });
    this.ta.addEventListener('blur', () => { this.focused = false; this.board.classList.remove('typing'); });
    this.ta.addEventListener('beforeinput', () => { this._preEdit = this.snapshot(); });
    this.ta.addEventListener('input', () => {
      const before = this._preEdit || this.snapshot();
      this._preEdit = null;
      if (this.text.update(this.ta.value)) {
        this.history.push(before, 'typing', 1200);
        this.dirty.layout = true;
        this.ui?.refresh();
      }
      this.caret = this.ta.selectionStart;
    });
    const syncCaret = () => { if (this.focused) this.caret = this.ta.selectionStart; };
    this.ta.addEventListener('keyup', syncCaret);
    this.ta.addEventListener('select', syncCaret);
    document.addEventListener('selectionchange', syncCaret);
    window.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        if (e.shiftKey) this.redo(); else this.undo();
        return;
      }
      if (mod && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); this.redo(); return; }
      if (e.key === 'Escape' && this.focused) { this.ta.blur(); return; }
      if (e.key === 'Escape' && this.uiHidden && !document.fullscreenElement) { this.setUiHidden(false); return; }
      const a = document.activeElement;
      const editing = this.focused || a?.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(a?.tagName);
      if (!editing && !mod && !e.altKey) {
        const k = e.key.toLowerCase();
        if (e.key === ' ' && (a === document.body || !a)) { e.preventDefault(); this.togglePause(); }
        else if (k === 'r') this.restart(true);
        else if (k === 'g') this.randomize();
        else if (k === 'h') this.setUiHidden(!this.uiHidden);
        else if (k === 'f') this.toggleFullscreen();
      }
    }, true);
  }

  // place dots along the drag at the type's dot pitch; alt removes placed dots instead
  dragDots(remove) {
    const p = this.pointer;
    const r = this.layout.r, pitch = this.layout.pitch;
    if (remove) {
      const keep = this.settings.placed.filter(d => Math.hypot(d.x - p.x, d.y - p.y) > Math.max(r * 1.2, 6));
      if (keep.length !== this.settings.placed.length) this.set('placed', keep, { history: false });
      return;
    }
    if (this.lastDot && Math.hypot(p.x - this.lastDot[0], p.y - this.lastDot[1]) < pitch) return;
    const id = this.settings.placed.reduce((m, d) => Math.max(m, d.id), 0) + 1;
    this.set('placed', [...this.settings.placed, { id, x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 }], { history: false });
    this.lastDot = [p.x, p.y];
  }

  togglePause() { this.paused = !this.paused; this.ui?.refresh(); }

  // text typed into the panel's field: one undo step per burst of typing
  setText(v) {
    const before = this.snapshot();
    if (!this.text.update(v)) return;
    this.history.push(before, 'typing', 1200);
    this.dirty.layout = true;
    this.ta.value = this.text.text;
    this.caret = Math.min(this.caret, this.text.text.length);
  }

  // the artwork alone: controls hidden, the artboard fitted to the whole window (H, Esc)
  setUiHidden(off) {
    this.uiHidden = !!off;
    document.documentElement.dataset.ui = this.uiHidden ? 'off' : 'on';
    if (this.uiHidden) this.ta.blur();
  }

  toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen?.(); return; }
    const el = document.documentElement;
    if (!el.requestFullscreen) { this.setUiHidden(true); return; }
    this.fsHid = !this.uiHidden;
    this.setUiHidden(true);
    el.requestFullscreen().catch(() => { this.fsHid = false; });
  }

  // the colour the canvas shows: the surface, or the heat map's outside colour
  get canvasColour() {
    const h = this.settings.heat;
    return h.on ? (h.colors[h.colors.length - 1] || '#ffffff') : this.matSettings.background;
  }

  canvasEdge() {
    if (!this.board) return;
    this.board.style.setProperty('--canvas', this.canvasColour);
    canvasEdge(this.canvasColour);
  }

  endDrag() { this.dragging = false; }

  toast(msg, err) { toast(msg, err); }

  // ------------------------------------------------------------ frame
  loop(now) {
    requestAnimationFrame((t) => this.loop(t));
    let dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    if (!(dt > 0)) dt = 1 / 60;
    dt = Math.min(dt, 0.1);
    this.fps = this.fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
    this.frame(dt);
  }

  // spherical-cap height of a dot bead (artboard px)
  capPx(r) {
    const th = Math.min(Math.max(this.matSettings.contactAngle, 12), 88) * Math.PI / 180;
    return r / Math.sin(th) * (1 - Math.cos(th));
  }

  frame(dt) {
    if (!this.paused) this.ui?.tick(dt);
    const s = this.settings;
    if (this.dirty.alloc) { this.allocSim(); this.dirty.alloc = false; this.dirty.layout = true; this.dirty.congeal = true; }
    if (this.dirty.layout) { this.rebuildLayout(); this.dirty.layout = false; }
    if (this.dirty.congeal) this.restart(false);
    if (this.dirty.env) { this.renderer.buildEnv(s, this.image?.avg); this.dirty.env = false; this.canvasEdge(); }

    const [aw, ah] = this.art;
    const nx = this.sim.nx, ny = this.sim.ny;
    const p = this.pointer;
    const ms = this.matSettings;
    const tool = s.tool;
    const active = p.inside && !this.focused && (tool !== 'congeal' || s.liquefy === 'hover' || !!p.down);

    // cursor turns the dots it touches to liquid (sweeping the segment travelled this frame)
    if (tool === 'congeal' && active && !this.paused) {
      const R = s.cursorRadius;
      const ax = p.px, ay = p.py, bx = p.x, by = p.y;
      const sx = bx - ax, sy = by - ay, l2 = sx * sx + sy * sy;
      for (const d of this.dots) {
        if (d.liquid) continue;
        const t = l2 > 0 ? clamp(((d.x - ax) * sx + (d.y - ay) * sy) / l2, 0, 1) : 1;
        if (Math.hypot(d.x - (ax + sx * t), d.y - (ay + sy * t)) < R * 0.85 + d.r * 0.3) this.liquefy(d);
      }
    }
    // geometric hover: congealed dots the cursor passes over swell and drift toward it, and stay that way
    // (each keeps the strongest touch it has had, pulled toward where the cursor was at that moment)
    if (this.geometric && !this.paused && (this.geo.size || (tool === 'congeal' && active && (s.hoverGrow > 0 || s.hoverPull > 0 || s.tension > 0)))) {
      const on = tool === 'congeal' && active, R = Math.max(s.cursorRadius, 1);
      const k = 1 - Math.exp(-dt * 9);
      let moved = false;
      for (const d of this.dots) {
        if (!d.liquid || !d.geo) continue;
        let w = 0;
        if (on) {
          const t = Math.hypot(d.x - p.x, d.y - p.y) / R;
          w = t < 1 ? (1 - t * t) * (1 - t * t) : 0;
        }
        let g = this.geo.get(d.key);
        if (!g) { if (!w) continue; g = { s: 1, base: 1, ox: 0, oy: 0, w: 0, px: d.x, py: d.y }; this.geo.set(d.key, g); }
        if (w > g.w) { g.w = w; g.px = p.x; g.py = p.y; }
        // every touch joins a bead; surface tension decides how far its dots run together
        if (w > 0 && !g.bead) g.bead = this.beadFor(d, p, R);
        const tm = g.bead ? s.tension : 0, gm = g.m || 0;
        g.m = gm + (tm - gm) * (1 - Math.exp(-dt * 6));
        if (Math.abs(g.m - gm) > 1e-4) moved = true;
        const ts = (g.base || 1) * (1 + s.hoverGrow * g.w), tx = (g.px - d.x) * s.hoverPull * g.w, ty = (g.py - d.y) * s.hoverPull * g.w;
        const ns = g.s + (ts - g.s) * k, nx = g.ox + (tx - g.ox) * k, ny = g.oy + (ty - g.oy) * k;
        if (Math.abs(ns - g.s) > 1e-4 || Math.abs(nx - g.ox) > 0.01 || Math.abs(ny - g.oy) > 0.01) moved = true;
        g.s = ns; g.ox = nx; g.oy = ny;
      }
      if (moved && !this.staticDirty) this.uploadUnion();
    }
    if (this.staticDirty) this.uploadStatic();
    // the dry tool: congealed dots under the cursor go back to plain dots
    if (tool === 'wipe' && p.down && p.inside && !this.paused) {
      const R = s.cursorRadius;
      const ax = p.px, ay = p.py, sx = p.x - ax, sy = p.y - ay, l2 = sx * sx + sy * sy;
      for (const d of this.dots) {
        if (!d.liquid) continue;
        const t = l2 > 0 ? clamp(((d.x - ax) * sx + (d.y - ay) * sy) / l2, 0, 1) : 1;
        if (Math.hypot(d.x - (ax + sx * t), d.y - (ay + sy * t)) < R * 0.85 + d.r * 0.3) {
          d.liquid = false; this.liquid.delete(d.key); this.geo.delete(d.key); this.staticDirty = true;
        }
      }
    }
    if (this.injectQueue.length) {
      this.sim.inject(this.injectQueue, ms.contactAngle);
      this.injectQueue.length = 0;
      this.simUsed = true;
    }

    // cursor velocity (m/s, sim axes), smoothed
    const vx = (p.x - p.px) / Math.max(dt, 1e-3) / this.mToPx, vy = -(p.y - p.py) / Math.max(dt, 1e-3) / this.mToPx;
    p.vx = p.vx * 0.6 + vx * 0.4; p.vy = p.vy * 0.6 + vy * 0.4;
    const cellPerPx = nx / aw;
    const r0 = this.layout.r;
    // congealing is geometric: the liquid sim only runs if something ever put liquid into it
    if (!this.paused && this.simUsed) {
      const ph = {
        dx: this.dx, rhoL: this.mat.rhoL,
        sigma: ms.surfaceTension / 1000, viscosity: ms.viscosity / 1000, theta: ms.contactAngle,
        gravity: s.gravity, gravityAngle: s.gravityAngle, pinning: ms.pinning, coalesce: s.coalesce,
        timeScale: s.timeScale,
        bond: clamp(Math.pow(2.5 / (r0 * this.pxMm), 2), 0.08, 1),
      };
      const pressed = !!p.down;
      const congealOn = tool === 'congeal' && active;
      const forces = {
        cur: [p.x * cellPerPx, (1 - p.y / ah) * ny, s.cursorRadius * cellPerPx, (congealOn || (tool === 'wipe' && pressed && p.inside)) ? 1 : 0],
        curVel: [p.vx, p.vy],
        pull: congealOn ? s.pull * s.pull * 90 * (pressed ? 1.6 : 1) : 0,
        drag: congealOn && pressed ? s.carry * 45 : 0,
        wipe: tool === 'wipe' && pressed && p.inside,
        life: 2.6, gatherR: Math.max(r0 * cellPerPx * 1.2, 1.5),
        bulkLod: clamp(Math.log2(Math.max(r0 * cellPerPx, 1)), 0, 5),
        href: 0.42 * this.capPx(r0) / this.mToPx, pxToM: 1 / this.mToPx,
      };
      this.sim.step(dt, ph, forces, s.perf.maxSubsteps);
    }
    p.px = p.x; p.py = p.y;
    if (this.frameCount % 12 === 0) this.sim.requestStats();

    // beads that run over a dry dot pick it up
    // every dry dot is live: liquid that reaches one fuses with it
    if (!this.paused && this.dots.some(d => !d.geo) && this.frameCount % 3 === 0 && this.staticList?.length) {
      const gen = this.staticGen, list = this.staticList;
      const thr = 0.15 * this.capPx(r0) / this.mToPx;
      // in the heavier weights neighbouring dots overlap, so the ring stays inside the gap they leave
      const lay = this.layout;
      const ring = clamp(Math.min(0.45, 0.85 * (lay.pitch - lay.r) / lay.r), 0.1, 0.45);
      this.sim.probe(this.renderer.dotData, list.length, [cellPerPx, ny / ah], ring, (data) => {
        if (gen !== this.staticGen) return;
        for (let i = 0; i < list.length; i++) {
          if (data[i * 4] <= thr) continue;
          const d = this.dotByKey.get(list[i].key);
          if (d) this.liquefy(d);
        }
      });
    }

    this.renderer.render({
      art: [aw, ah], sim: this.sim, mToPx: this.mToPx, pxMm: this.pxMm, settings: s,
      heatMode: this.heatMode, dotTheta: ms.contactAngle, hmaxPx: Math.max(this.capPx(r0), this.sim.hmaxEst * this.mToPx),
      imgXf: this.imageXf(), staticGrain: this.reducedMotion,
    }, this.paused ? 0 : dt);

    if (this.exportRequest) { const r = this.exportRequest; this.exportRequest = null; r(); }
    this.drawOverlay();
    if (this.frameCount % 15 === 0) this.ui?.hud();
    this.autoQuality(dt);
    this.frameCount++;
  }

  autoQuality(dt) {
    if (this.autoDone || this.noAuto || document.hidden) return;
    this.aqFrames = (this.aqFrames || 0) + 1;
    this.aqTime = (this.aqTime || 0) + dt;
    if (this.aqFrames < 150) return;
    const fps = this.aqFrames / this.aqTime;
    this.aqFrames = 0; this.aqTime = 0;
    const perf = this.settings.perf;
    if (fps < 36 && perf.simRes > 384) {
      perf.simRes = 384; this.dirty.alloc = true;
      this.defaults.perf.simRes = 384;
      this.toast('Using medium simulation quality for a smoother frame rate');
      this.ui?.refresh();
    } else if (fps < 30 && perf.renderScale > 0.7) {
      perf.renderScale = 0.7; this.fitBoard(); this.autoDone = true;
      this.toast('Lowered render scale for a smoother frame rate');
      this.ui?.refresh();
    } else {
      this.autoDone = true;
    }
  }

  drawOverlay() {
    const o = this.overlay, ctx = o.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, o.width, o.height);
    const [aw] = this.art;
    const k = o.width / aw;
    const s = this.settings;
    const bgDark = luminance(this.matSettings.background) < 0.35;
    const ink = bgDark ? 'rgba(255,255,255,0.85)' : 'rgba(20,24,28,0.85)';
    if (this.focused && this.layout) {
      const c = this.layout.carets[Math.min(this.caret, this.layout.carets.length - 1)];
      if (c && (this.reducedMotion || Math.floor(performance.now() / 530) % 2 === 0)) {
        const top = c.y - this.layout.capHeight * 1.08, bot = c.y + this.layout.capHeight * 0.14;
        ctx.fillStyle = ink;
        ctx.fillRect(Math.round(c.x * k) - 1, top * k, Math.max(1.5, 2 * this.overlayScale), (bot - top) * k);
      }
    }
    const p = this.pointer;
    ctx.lineWidth = 1 * this.overlayScale;
    ctx.strokeStyle = bgDark ? 'rgba(255,255,255,0.55)' : 'rgba(30,30,34,0.5)';
    // dot tool: preview of the dot about to be placed
    if (s.tool === 'dots' && p.inside && this.layout) {
      ctx.setLineDash([2 * this.overlayScale, 3 * this.overlayScale]);
      ctx.beginPath(); ctx.arc(p.x * k, p.y * k, this.layout.r * k, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      return;
    }
    if (performance.now() < (this.ringUntil || 0) || (s.tool === 'wipe' && p.inside)) {
      const [, ah] = this.art;
      const cx = p.inside ? p.x : aw / 2, cy = p.inside ? p.y : ah / 2;
      ctx.setLineDash([3 * this.overlayScale, 4 * this.overlayScale]);
      ctx.beginPath(); ctx.arc(cx * k, cy * k, s.cursorRadius * k, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // the artwork as vectors: the canvas, the dry dots, and each congealed dot with its bridges drawn
  // exactly as the shader draws them (a straight hull at full width, or two fillet arcs tangent to
  // both dots). A heat map is pixels, so it goes in as an embedded image under any vector dots.
  exportSVG() {
    const build = (heatPng) => {
      const [aw, ah] = this.art, s = this.settings, m = this.matSettings;
      const f = (v) => +v.toFixed(2);
      const out = [`<svg xmlns="http://www.w3.org/2000/svg" width="${aw}" height="${ah}" viewBox="0 0 ${aw} ${ah}">`];
      out.push(`<rect id="canvas" width="${aw}" height="${ah}" fill="${this.canvasColour}"/>`);
      if (heatPng) out.push(`<image id="heatmap" width="${aw}" height="${ah}" href="${heatPng}"/>`);
      const drawDots = !s.heat.on || s.heat.dotsOnTop;
      if (drawDots) {
        const dry = this.dots.filter(d => !d.liquid);
        out.push(`<g id="dots" fill="${m.dots}">`);
        for (const d of dry) out.push(`<circle cx="${f(d.x)}" cy="${f(d.y)}" r="${f(d.r)}"/>`);
        out.push('</g>');
        const { wet = [], pairs = [] } = this.unionGeom || {};
        out.push(`<g id="congealed" fill="${s.heat.on ? m.dots : m.tint}">`);
        for (const d of wet) out.push(`<circle cx="${f(d.x)}" cy="${f(d.y)}" r="${f(d.r)}"/>`);
        for (const [a, b] of pairs) { const p = this.neckPath(a, b, s.bridge, f); if (p) out.push(`<path d="${p}"/>`); }
        out.push('</g>');
      }
      out.push('</svg>');
      saveFile(new Blob([out.join('\n')], { type: 'image/svg+xml' }), `${slug()}-${stamp()}.svg`);
    };
    if (this.settings.heat.on) this.exportRequest = () => build(this.canvas.toDataURL('image/png'));
    else build(null);
  }

  // the bridge between two congealed dots, as an SVG path in artboard px (y down)
  neckPath(a, b, wf, f) {
    const rA = a.r, rB = b.r, dx = b.x - a.x, dy = b.y - a.y, D = Math.hypot(dx, dy);
    if (D <= Math.abs(rA - rB) + 1e-3) return null;
    const u = [dx / D, dy / D], n = [-u[1], u[0]];
    const P = (o, k1, v1, k2, v2) => [o.x + k1 * v1[0] + k2 * v2[0], o.y + k1 * v1[1] + k2 * v2[1]];
    const xy = (p) => `${f(p[0])} ${f(p[1])}`;
    if (wf >= 0.999) {
      // full width: the straight-sided hull, bounded by the two outer tangent lines
      const bb = (rA - rB) / D, c = Math.sqrt(1 - bb * bb);
      const side = (sg) => [P(a, rA * bb, u, sg * rA * c, n), P(b, rB * bb, u, sg * rB * c, n)];
      const [a1, b1] = side(1), [a2, b2] = side(-1);
      return `M${xy(a1)}L${xy(b1)}L${xy(b2)}L${xy(a2)}Z`;
    }
    const rm = (rA + rB) / 2, q = D / 2, w = wf * rm;
    const F = (q * q + w * w - rm * rm) / (2 * (rm - w));
    if (!(F > 0)) return null;   // the dots already overlap wider than the waist
    const x0 = (D * D + (rA + F) ** 2 - (rB + F) ** 2) / (2 * D), h2 = (rA + F) ** 2 - x0 * x0;
    if (!(h2 > 0)) return null;
    const h = Math.sqrt(h2);
    const arc = (sg) => {
      const C = P(a, x0, u, sg * h, n);
      const tA = [a.x + (C[0] - a.x) * rA / (rA + F), a.y + (C[1] - a.y) * rA / (rA + F)];
      const tB = [b.x + (C[0] - b.x) * rB / (rB + F), b.y + (C[1] - b.y) * rB / (rB + F)];
      return { C, tA, tB };
    };
    // the short way round each fillet circle, from one tangent point to the other
    const sweep = (C, p0, p1) => {
      let d = Math.atan2(p1[1] - C[1], p1[0] - C[0]) - Math.atan2(p0[1] - C[1], p0[0] - C[0]);
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d <= -Math.PI) d += 2 * Math.PI;
      return d > 0 ? 1 : 0;
    };
    const t = arc(1), bt = arc(-1), R = f(F);
    return `M${xy(t.tA)}A${R} ${R} 0 0 ${sweep(t.C, t.tA, t.tB)} ${xy(t.tB)}L${xy(bt.tB)}A${R} ${R} 0 0 ${sweep(bt.C, bt.tB, bt.tA)} ${xy(bt.tA)}Z`;
  }

  exportPNG() {
    this.exportRequest = () => {
      this.canvas.toBlob((blob) => {
        if (blob) saveFile(blob, `${slug()}-${stamp()}.png`);
      }, 'image/png');
    };
  }
}


function luminance(hex) {
  const v = parseInt(hex.slice(1), 16);
  return (0.2126 * ((v >> 16) & 255) + 0.7152 * ((v >> 8) & 255) + 0.0722 * (v & 255)) / 255;
}

function diffPaths(a, b, prefix = '') {
  const out = [];
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) {
    const pa = a?.[k], pb = b?.[k];
    const path = prefix ? prefix + '.' + k : k;
    if (pa && pb && typeof pa === 'object' && typeof pb === 'object') out.push(...diffPaths(pa, pb, path));
    else if (pa !== pb) out.push(path);
  }
  return out.map(p => p.replace(/^mat\.(sweat|ink|mercury)\./, 'mat.'));
}

const app = new App();
app.init();

</script>
</body>
