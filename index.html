// margins, pair, presets, congealBtns, dotBtns, image, actions, settingsBtns, note
function sections(app) {
  const tool = (t) => () => app.settings.tool === t;
  const heat = () => !!app.settings.heat.on;
  const notHeat = () => !heat();
  const runs = () => app.settings.pattern === 'runs';
  const clusters = () => !runs();
  return [
    {
      col: 'left', badge: '1', title: 'Text', items: [
        { kind: 'text' },
        { kind: 'seg', path: 'weight', options: WEIGHTS, hint: 'Interdot weight: every weight is the same dots, grown' },
        { kind: 'range', path: 'fontSize', label: 'Size', min: 24, max: 1600, step: 1, unit: 'px' },
        { kind: 'range', path: 'leading', label: 'Leading', min: 0.5, max: 2.5, step: 0.01, mult: 100, unit: '%' },
        { kind: 'range', path: 'tracking', label: 'Tracking', min: -200, max: 800, step: 1, unit: '‰' },
        { kind: 'seg', path: 'align', options: [['left', 'Left'], ['center', 'Centre'], ['right', 'Right']] },
        { kind: 'seg', path: 'valign', options: [['top', 'Top'], ['middle', 'Middle'], ['bottom', 'Bottom']] },
        { kind: 'margins' },
      ],
    },
    {
      col: 'left', badge: '2', title: 'Congeal', items: [
        { kind: 'presets' },
        { kind: 'range', path: 'reach', label: 'Reach', min: 0, max: 5, step: 0.05, digits: 2, unit: '×', hint: 'Join congealed dots closer than this many dot spacings: 1 = side by side, 1.42 = diagonals too, 0 = no bridges. Grown dots reach further in proportion' },
        { kind: 'popup', path: 'bridgeMode', label: 'Bridges', options: [['any', 'Any direction'], ['grid', 'Neighbours only']], hint: 'Neighbours only: a dot joins just the dots directly above, below or beside it, never diagonally or further away, however much it grows' },
        { kind: 'range', path: 'bridge', label: 'Bridge width', min: 0.1, max: 1, step: 0.01, mult: 100, unit: '%', hint: 'Width at the narrowest point of each bridge, as a share of the dot’s diameter. Below 100% the sides curve in as fillets tangent to both dots' },
        { kind: 'range', path: 'hoverGrow', label: 'Hover grow', min: 0, max: 3, step: 0.01, mult: 100, unit: '%', hint: 'How much congealed dots swell once the cursor has passed over them (100% = twice the size). Restart or Dry all to reset' },
        { kind: 'range', path: 'hoverPull', label: 'Hover pull', min: 0, max: 1, step: 0.01, mult: 100, unit: '%', hint: 'How far congealed dots move toward the cursor once it has passed over them, as a share of their distance. Dots pulled within reach bridge together' },
        { kind: 'congealBtns' },
        { kind: 'seg', path: 'pattern', options: [['clusters', 'Clusters'], ['runs', 'Swelling runs']], hint: 'Clusters: random groups of dots congeal. Swelling runs: dots congeal along the strokes, each a little bigger than the last' },
        { kind: 'range', path: 'amount', label: 'Amount', min: 0, max: 1, step: 0.01, mult: 100, unit: '%', hint: 'How much of each letterform’s dots congeal' },
        { kind: 'range', path: 'beadSize', label: 'Cluster size', min: 1, max: 16, step: 1, unit: 'dots', show: clusters, hint: 'Most dots that congeal together' },
        { kind: 'range', path: 'runLength', label: 'Run length', min: 2, max: 16, step: 1, unit: 'dots', show: runs, hint: 'How many dots each run follows along the stroke' },
        { kind: 'range', path: 'growth', label: 'Growth rate', min: 0, max: 1, step: 0.01, mult: 100, unit: '%', show: runs, hint: 'How much bigger each dot is than the one before it along a run, compounding: at 40% a dot two steps in is nearly twice the size' },
        { kind: 'popup', path: 'runShape', label: 'Run shape', show: runs, options: [['ramp', 'Grow along the run'], ['swell', 'Swell in the middle'], ['both', 'Grow and swell']] },
        { kind: 'range', path: 'variation', label: 'Variation', min: 0, max: 1, step: 0.01, mult: 100, unit: '%', hint: '0 = every cluster or run is the same, 100 = their sizes and growth vary widely' },
      ],
    },
    {
      col: 'left', badge: '3', title: 'Cursor', items: [
        { kind: 'seg', path: 'tool', options: [['congeal', 'Congeal'], ['dots', 'Place dots'], ['wipe', 'Dry']] },
        { kind: 'popup', path: 'liquefy', label: 'Congeal on', options: [['hover', 'Hover'], ['press', 'Press']], show: tool('congeal') },
        { kind: 'note', html: 'Click to place a dot the size of the type’s dots; drag to draw a row; Alt-click removes one.', show: tool('dots') },
        { kind: 'note', html: 'Press and drag to dry congealed dots again.', show: tool('wipe') },
        { kind: 'range', path: 'cursorRadius', label: 'Radius', min: 6, max: 400, step: 1, unit: 'px' },
        { kind: 'dotBtns' },
      ],
    },
    {
      col: 'right', badge: '◐', title: 'Material', items: [
        { kind: 'look' },
        { kind: 'color', path: 'mat.dots', label: 'Dots', show: notHeat, swatches: ['#000000', '#ffffff', '#b3262b'] },
        { kind: 'color', path: 'mat.tint', label: 'Congealed', show: notHeat, swatches: ['#000000', '#ffffff', '#b3262b'] },
        { kind: 'color', path: 'mat.background', label: 'Background', show: notHeat, swatches: ['#000000', '#ffffff', '#ff2a98'] },
        { kind: 'heatColors', show: heat },
        { kind: 'range', path: 'heat.band', label: 'Band width', min: 1, max: 120, step: 0.5, digits: 1, unit: 'px', log: true, show: heat, hint: 'The width of each colour band, measured from the edge of the blob' },
        { kind: 'range', path: 'heat.inner', label: 'Bands inside', min: 0, max: 7, step: 0.1, digits: 1, unit: '', show: heat, hint: 'How many colours fall inside a blob’s edge; the rest ring the outside. Only blobs deeper than this reach the centre colour' },
        { kind: 'range', path: 'heat.growth', label: 'Band growth', min: 0.5, max: 2, step: 0.01, digits: 2, unit: '×', show: heat, hint: 'Each band outward is this many times as wide as the one inside it: 1 = all bands even' },
        { kind: 'range', path: 'heat.merge', label: 'Merge', min: 0, max: 120, step: 1, unit: 'px', show: heat, hint: 'Rounds the outline and joins shapes closer than about this distance before the bands are laid out' },
        { kind: 'range', path: 'heat.blend', label: 'Blend', min: 0, max: 1, step: 0.01, mult: 100, unit: '%', show: heat, hint: 'Blur between neighbouring colours: 0 = crisp contour bands, 100 = smooth gradient' },
        { kind: 'switch', path: 'heat.dry', label: 'Include dry dots', sub: 'Off: only congealed dots make heat', show: heat },
        { kind: 'switch', path: 'heat.dotsOnTop', label: 'Dots on top', sub: 'Draw the dots over the map in the dot colour', show: heat },
        { kind: 'color', path: 'mat.dots', label: 'Dots', show: () => heat() && app.settings.heat.dotsOnTop, swatches: ['#16161b', '#ffffff'] },
      ],
    },
    {
      col: 'right', badge: '↑', title: 'Canvas & output', items: [
        { kind: 'popup', path: 'aspect', label: 'Artboard', options: [...Object.keys(ARTBOARDS).map(k => [k, `${k} · ${ARTBOARDS[k][0]}×${ARTBOARDS[k][1]}`]), ['custom', 'Custom…']] },
        { kind: 'pair', paths: ['customW', 'customH'], label: 'Size', show: () => app.settings.aspect === 'custom', min: 200, max: 4000 },
        { kind: 'range', path: 'perf.renderScale', label: 'Render scale', min: 0.35, max: 1, step: 0.05, mult: 100, unit: '%' },
        { kind: 'actions' },
      ],
    },
    {
      col: 'right', badge: '↺', title: 'Settings', items: [
        { kind: 'settingsBtns' },
        { kind: 'note', html: 'Undo with Ctrl or Cmd + Z, redo with Shift as well. Space pauses, R restarts, G congeals at random, H hides the controls, F goes full screen.' },
      ],
    },
  ];
}

function buildUI(app) {
  const refreshers = [];
  const tickers = [];
  let pending = null, bUndo = null, bRedo = null;
  const begin = () => { if (!pending) { pending = app.snapshot(); app.dragging = true; } };
  const commit = () => { if (pending) { app.history.push(pending); pending = null; } app.endDrag(); };

  const $ = (id) => document.getElementById(id);
  const defaultOf = (path) => (path.startsWith('mat.')
    ? app.defaults.mat[app.settings.material]?.[path.slice(4)]
    : getPath(app.defaults, path));
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const btn = (cls, label, title) => { const b = el('button', cls, label); b.type = 'button'; if (title) b.title = title; return b; };
  const val = (x) => (typeof x === 'function' ? x() : x);
  const showable = (node, it) => { if (it.show) refreshers.push(() => { node.hidden = !it.show(); }); return node; };
  const cols = { left: $('colLeft'), right: $('colRight') };

  // the wordmark, set in the face itself

  for (const sec of sections(app)) {
    const startOpen = false;
    const box = el('section', 'panel' + (startOpen ? ' open' : ''));
    const head = el('div', 'phead', `<span class="badge">${sec.badge}</span><span>${sec.title}</span>`);
    let body = box;
    {
      const d = btn('disclose' + (startOpen ? ' open' : ''), null);
      d.append(head, el('span', 'caret', '›'));
      d.setAttribute('aria-expanded', String(startOpen));
      d.addEventListener('click', () => {
        const open = !box.classList.contains('open');
        box.classList.toggle('open', open); d.classList.toggle('open', open); d.setAttribute('aria-expanded', String(open));
      });
      body = el('div', 'advbody');
      box.append(d, body);
    }
    cols[sec.col].append(box);
    // menus and colours sit together in rows split by hairlines
    let rows = null;
    for (const it of sec.items) {
      const node = build(it);
      if (!node) continue;
      if (it.kind === 'popup' || it.kind === 'color') {
        if (!rows) { rows = el('div', 'rows'); body.append(rows); }
        rows.append(node);
      } else { rows = null; body.append(node); }
    }
  }

  function build(it) {
    switch (it.kind) {
      case 'range': return rangeCtl(it);
      case 'seg': return showable(segCtl(it), it);
      case 'popup': return showable(popupCtl(it), it);
      case 'color': return showable(colorCtl(it), it);
      case 'switch': return showable(switchCtl(it), it);
      case 'heatColors': return showable(heatColorsCtl(), it);
      case 'look': return lookCtl();
      case 'text': return textCtl();
      case 'margins': return rangeCtl({
        label: 'Margins', min: 0, max: 600, step: 1, unit: 'px', hint: 'All four margins together',
        get: () => app.settings.marginTop,
        set: (v) => ['marginTop', 'marginRight', 'marginBottom', 'marginLeft'].forEach(k => app.set(k, v, { history: false })),
        dflt: () => app.defaults.marginTop,
      });
      case 'pair': return pairCtl(it);
      case 'presets': return presetsCtl();
      case 'congealBtns': return congealCtl();
      case 'dotBtns': return dotBtnsCtl();
      case 'image': return imageCtl();
      case 'actions': return actionsCtl();
      case 'settingsBtns': return settingsCtl();
      case 'note': return showable(el('div', 'note', it.html), it);
      default: return null;
    }
  }

  // a value beside its label that can be clicked and typed into
  function typeable(v, onCommit) {
    v.classList.add('typein');
    v.title = 'Click to type a value';
    let editing = false, cancelled = false;
    const finish = () => {
      if (!editing) return;
      editing = false;
      v.contentEditable = 'false';
      v.classList.remove('editing');
      const n = parseFloat(String(v.textContent).replace(',', '.').replace(/[^0-9.eE+-]/g, ''));
      if (!cancelled && Number.isFinite(n)) onCommit(n);
      else onCommit(null);
      cancelled = false;
    };
    v.addEventListener('mousedown', (e) => {
      if (editing) return;
      e.preventDefault();
      editing = true; cancelled = false;
      v.contentEditable = 'true';
      v.classList.add('editing');
      v.focus();
      const r = document.createRange(); r.selectNodeContents(v);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
    });
    v.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); v.blur(); }
      else if (e.key === 'Escape') { e.preventDefault(); cancelled = true; v.blur(); }
    });
    v.addEventListener('blur', finish);
  }

  function rangeCtl(it) {
    const row = el('div', 'row' + (it.nested ? ' nested' : ''));
    if (it.hint) row.title = it.hint;
    const head = el('div', 'rowhead'), lab = el('span', 'lab'), v = el('span', 'val');
    lab.append(el('span', null, it.label));
    head.append(lab, v);
    const r = el('input'); r.type = 'range'; r.setAttribute('aria-label', it.label);
    row.append(head, r);
    const extra = it.note ? el('div', 'note') : null;
    if (extra) row.append(extra);
    const get = it.get || (() => getPath(app.settings, it.path));
    const put = it.set || ((x) => app.set(it.path, x, { history: false }));
    const oscPath = it.osc ? 'osc.' + it.path : null;
    const oscOn = () => !!(oscPath && getPath(app.settings, oscPath)?.on);
    let oscBtn = null;
    if (it.osc) {
      oscBtn = btn('osc', WAVE, 'Sweep back and forth');
      oscBtn.setAttribute('aria-label', `Oscillate ${it.label.toLowerCase()}`);
      oscBtn.addEventListener('click', () => { app.set(oscPath + '.on', !oscOn()); refreshAll(); });
      lab.append(oscBtn);
    }
    const mult = it.mult || 1;
    const digits = it.digits ?? (it.step < 1 && !it.mult ? 2 : 0);
    const unitOf = (x) => {
      if (!it.unit) return '';
      if (it.unit === 'dots') return Math.round(x) === 1 ? ' dot' : ' dots';
      return TIGHT_UNITS.has(it.unit) ? it.unit : ' ' + it.unit;
    };
    const toSlider = (x) => it.log ? 1000 * Math.log(x / val(it.min)) / Math.log(val(it.max) / val(it.min)) : x;
    const fromSlider = (x) => it.log ? val(it.min) * Math.pow(val(it.max) / val(it.min), x / 1000) : x;
    const setBounds = () => {
      if (it.log) { r.min = 0; r.max = 1000; r.step = 1; }
      else { r.min = val(it.min); r.max = val(it.max); r.step = it.step; }
    };
    const fill = () => {
      const lo = parseFloat(r.min), hi = parseFloat(r.max);
      r.style.setProperty('--p', (clamp((parseFloat(r.value) - lo) / (hi - lo || 1), 0, 1) * 100).toFixed(2) + '%');
    };
    const show = (x) => {
      if (!(typeof x === 'number' && Number.isFinite(x))) return;
      v.textContent = fmtNum(x * mult, digits) + unitOf(x);
      if (it.note) extra.textContent = it.note(x);
    };
    const refresh = () => {
      setBounds();
      const x = get();
      r.value = toSlider(x);
      fill();
      if (!v.classList.contains('editing')) show(x);
      if (it.show) row.hidden = !it.show();
      if (oscBtn) { const on = oscOn(); oscBtn.classList.toggle('on', on); oscBtn.setAttribute('aria-pressed', String(on)); }
    };
    const quant = (x) => {
      const s = it.log ? Math.pow(10, Math.floor(Math.log10(Math.abs(x) || 1)) - 2) : it.step;
      return Math.round(x / s) * s;
    };
    // a sweeping slider can still be grabbed or typed into, but its value is transient so it skips undo
    const apply = (x) => {
      if (oscOn()) put(x);
      else { begin(); put(x); commit(); }
    };
    r.addEventListener('input', () => {
      const x = quant(fromSlider(parseFloat(r.value)));
      if (!oscOn()) begin();
      put(x);
      show(x); fill();
    });
    r.addEventListener('change', commit);
    r.addEventListener('dblclick', () => {
      const d = it.dflt ? it.dflt() : defaultOf(it.path);
      if (d == null) return;
      apply(d); refresh();
    });
    typeable(v, (n) => {
      if (n != null) apply(clamp(n / mult, val(it.min), val(it.max)));
      refresh();
    });
    refreshers.push(refresh);
    if (!it.osc) return row;

    // cosine sweep across the slider's full travel. phase 0..0.5 runs left to right, 0.5..1 back
    let phase = null, wrote = null, held = false;
    r.addEventListener('pointerdown', () => { held = true; });
    const release = () => { held = false; };
    window.addEventListener('pointerup', release, true);
    window.addEventListener('pointercancel', release, true);
    tickers.push((dt) => {
      const o = getPath(app.settings, oscPath);
      if (!o?.on) { phase = null; return; }
      if (held) return;
      const lo = parseFloat(r.min), hi = parseFloat(r.max);
      const cur = get();
      if (phase === null || cur !== wrote) {
        const a = Math.acos(1 - 2 * clamp((toSlider(cur) - lo) / (hi - lo), 0, 1)) / (2 * Math.PI);
        phase = phase !== null && phase > 0.5 ? 1 - a : a;
      }
      phase = (phase + dt * o.speed / OSC_PERIOD) % 1;
      const x = fromSlider(lo + (hi - lo) * (0.5 - 0.5 * Math.cos(2 * Math.PI * phase)));
      put(x);
      wrote = x;
      r.value = toSlider(x);
      fill();
      if (!v.classList.contains('editing')) show(x);
    });
    const speed = rangeCtl({
      path: oscPath + '.speed', label: 'Speed', min: 0.1, max: 10, step: 0.01, digits: 2, unit: '×', log: true, nested: true,
      show: oscOn, hint: `1× = one sweep there and back every ${OSC_PERIOD} s`, note: (x) => `${secs(OSC_PERIOD / x)} per cycle`,
    });
    const group = el('div', 'group');
    group.append(row, speed);
    return group;
  }

  function segCtl(it) {
    const seg = el('div', it.big ? 'seg' : 'seg small');
    seg.setAttribute('role', 'radiogroup');
    if (it.hint) seg.title = it.hint;
    const btns = it.options.map(([v, t]) => {
      const b = btn(null, t);
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => { app.set(it.path, v); refreshAll(); });
      seg.append(b);
      return [v, b];
    });
    refreshers.push(() => btns.forEach(([v, b]) => {
      const on = getPath(app.settings, it.path) === v;
      b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on));
    }));
    return seg;
  }

  function popupCtl(it) {
    const node = el('div', 'popup');
    if (it.hint) node.title = it.hint;
    const sel = document.createElement('select');
    sel.setAttribute('aria-label', it.label);
    it.options.forEach(([v, t]) => { const o = el('option', null, t); o.value = String(v); sel.append(o); });
    const shown = el('span', 'pvalue');
    const wrap = el('span', 'pwrap');
    wrap.append(shown, sel);
    node.append(el('span', 'plabel', it.label), wrap);
    sel.addEventListener('change', () => { app.set(it.path, it.number ? Number(sel.value) : sel.value); refreshAll(); });
    refreshers.push(() => {
      const cur = String(getPath(app.settings, it.path));
      sel.value = cur;
      shown.textContent = it.options.find(([v]) => String(v) === cur)?.[1] ?? '—';
    });
    return node;
  }

  function colorCtl(it) {
    const node = el('div', 'colorrow');
    if (it.hint) node.title = it.hint;
    const wrapC = el('div', 'cwrap');
    const sw = (it.swatches || []).map(hex => {
      const b = btn('swatch', null, hex);
      b.style.background = hex;
      b.setAttribute('aria-label', `${it.label} ${hex}`);
      b.addEventListener('click', () => { app.set(it.path, hex); refresh(); });
      wrapC.append(b);
      return [hex, b];
    });
    const well = el('label', 'well');
    const chip = el('span');
    const c = el('input'); c.type = 'color'; c.setAttribute('aria-label', it.label);
    well.append(chip, c);
    const v = el('span', 'val');
    wrapC.append(well, v);
    node.append(el('span', 'plabel', it.label), wrapC);
    c.addEventListener('input', () => { begin(); app.set(it.path, c.value, { history: false }); refresh(); });
    c.addEventListener('change', commit);
    typeable(v, () => {
      let s = v.textContent.trim();
      if (!s.startsWith('#')) s = '#' + s;
      if (/^#[0-9a-f]{6}$/i.test(s)) app.set(it.path, s.toLowerCase());
      refresh();
    });
    const refresh = () => {
      const x = getPath(app.settings, it.path);
      if (typeof x !== 'string') return;
      c.value = x; chip.style.background = x;
      if (!v.classList.contains('editing')) v.textContent = x;
      sw.forEach(([hex, b]) => b.classList.toggle('on', hex.toLowerCase() === x.toLowerCase()));
    };
    refreshers.push(refresh);
    return node;
  }

  // the material: sweat or ink colours, or the heat map
  function lookCtl() {
    const seg = el('div', 'seg');
    seg.setAttribute('role', 'radiogroup');
    const opts = [['sweat', 'Sweat'], ['ink', 'Ink'], ['heat', 'Heatmap']];
    const cur = () => (app.settings.heat.on ? 'heat' : app.settings.material);
    const btns = opts.map(([v, t]) => {
      const b = btn(null, t);
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => {
        const before = app.snapshot();
        if (v === 'heat') app.set('heat.on', true, { history: false });
        else { app.set('heat.on', false, { history: false }); app.set('material', v, { history: false }); }
        app.history.push(before);
        refreshAll();
      });
      seg.append(b);
      return [v, b];
    });
    refreshers.push(() => btns.forEach(([v, b]) => { const on = cur() === v; b.classList.toggle('on', on); b.setAttribute('aria-checked', String(on)); }));
    return seg;
  }

  // the heat map's colours, centre first: recolour, reorder, remove or add (up to eight)
  function heatColorsCtl() {
    const wrap = el('div', 'group');
    const list = el('div', 'rows');
    const tools = el('div', 'btnrow');
    const add = btn('btn', 'Add colour'), rev = btn('btn', 'Reverse'), reset = btn('btn', 'Reset');
    tools.append(add, rev, reset);
    wrap.append(el('div', 'note', 'Centre of a blob first, open surface last.'), list, tools);
    const cols = () => app.settings.heat.colors;
    const put = (c) => { app.set('heat.colors', c); draw(); };
    add.addEventListener('click', () => { const c = cols(); if (c.length < 8) put([...c, c[c.length - 1] || '#ffffff']); });
    rev.addEventListener('click', () => put([...cols()].reverse()));
    reset.addEventListener('click', () => put(clone(app.defaults.heat.colors)));
    let sig = '';
    function draw() {
      const c = cols();
      sig = c.join();
      list.innerHTML = '';
      c.forEach((hex, i) => {
        const row = el('div', 'colorrow');
        const lab = el('span', 'plabel', i === 0 ? 'Centre' : i === c.length - 1 ? 'Outside' : `Band ${i}`);
        const cw = el('div', 'cwrap');
        const well = el('label', 'well'), chip = el('span'), inp = el('input');
        inp.type = 'color'; inp.value = hex; chip.style.background = hex;
        inp.setAttribute('aria-label', lab.textContent + ' colour');
        well.append(chip, inp);
        inp.addEventListener('input', () => { begin(); const n = [...cols()]; n[i] = inp.value; app.set('heat.colors', n, { history: false }); chip.style.background = inp.value; });
        inp.addEventListener('change', () => { commit(); draw(); });
        const up = btn('osc', '↑', 'Move toward the centre'), dn = btn('osc', '↓', 'Move outward'), x = btn('osc', '×', 'Remove');
        up.disabled = i === 0; dn.disabled = i === c.length - 1; x.disabled = c.length <= 2;
        const swap = (j) => { const n = [...cols()]; [n[i], n[j]] = [n[j], n[i]]; put(n); };
        up.addEventListener('click', () => swap(i - 1));
        dn.addEventListener('click', () => swap(i + 1));
        x.addEventListener('click', () => put(cols().filter((_, k) => k !== i)));
        cw.append(well, el('span', 'val', hex), up, dn, x);
        row.append(lab, cw);
        list.append(row);
      });
      add.disabled = c.length >= 8;
    }
    draw();
    refreshers.push(() => { if (cols().join() !== sig && !pending) draw(); });
    return wrap;
  }

  function switchCtl(it) {
    const c = el('label', 'check');
    c.append(el('span', 'box'));
    const t = el('span');
    t.append(document.createTextNode(it.label));
    if (it.sub) t.append(el('span', 'sub', it.sub));
    c.append(t);
    c.setAttribute('role', 'switch');
    c.tabIndex = 0;
    const toggle = (e) => { e.preventDefault(); app.set(it.path, !getPath(app.settings, it.path)); refreshAll(); };
    c.addEventListener('click', toggle);
    c.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') toggle(e); });
    const refresh = () => { const on = !!getPath(app.settings, it.path); c.classList.toggle('on', on); c.setAttribute('aria-checked', String(on)); };
    refreshers.push(refresh);
    return c;
  }

  function textCtl() {
    const ta = el('textarea', 'field textbox');
    ta.spellcheck = false;
    ta.setAttribute('aria-label', 'Text');
    ta.placeholder = 'Type here';
    ta.addEventListener('input', () => app.setText(ta.value));
    const wrap = el('div', 'group');
    wrap.append(ta, el('div', 'note', 'Or click the artboard and type. Interdot has A–Z, a–z, 0–9 and . , -'));
    refreshers.push(() => { if (document.activeElement !== ta && ta.value !== app.text.text) ta.value = app.text.text; });
    return wrap;
  }

  function pairCtl(it) {
    const row = el('div', 'pair');
    row.append(el('span', 'plabel', it.label));
    const fields = el('div', 'fields');
    const ins = it.paths.map((p) => {
      const i = el('input', 'field'); i.type = 'text'; i.inputMode = 'numeric';
      i.setAttribute('aria-label', p === 'customW' ? 'Artboard width' : 'Artboard height');
      i.addEventListener('change', () => { app.set(p, clamp(parseInt(i.value, 10) || 0, it.min, it.max)); refresh(); });
      return i;
    });
    fields.append(ins[0], el('span', 'x', '×'), ins[1]);
    row.append(fields);
    const refresh = () => { ins.forEach((i, k) => { if (document.activeElement !== i) i.value = getPath(app.settings, it.paths[k]); }); row.hidden = it.show && !it.show(); };
    refreshers.push(refresh);
    return row;
  }

  // each preset is one undo step
  function presetsCtl() {
    const chips = el('div', 'chips small');
    for (const p of PRESETS) {
      const b = btn('chip', p.name, p.hint);
      b.addEventListener('click', () => {
        const before = app.snapshot();
        const patch = p.patch();
        for (const k in patch) app.set(k, patch[k], { history: false });
        app.history.push(before);
        app.toast(p.name);
        refreshAll();
      });
      chips.append(b);
    }
    return chips;
  }

  function congealCtl() {
    const row = el('div', 'btnrow');
    const rnd = btn('btn primary wide', 'Random', 'Congeal a new random selection of dots (G)');
    const again = btn('btn wide', 'Restart', 'Dry everything and congeal the same selection again (R)');
    rnd.addEventListener('click', () => app.randomize());
    again.addEventListener('click', () => app.restart(true));
    row.append(rnd, again);
    return row;
  }

  function dotBtnsCtl() {
    const row = el('div', 'btnrow');
    const clr = btn('btn wide', 'Clear placed dots');
    clr.addEventListener('click', () => {
      if (!app.settings.placed.length) { app.toast('No placed dots'); return; }
      app.set('placed', []);
      refreshAll();
    });
    row.append(clr);
    refreshers.push(() => { clr.disabled = !app.settings.placed.length; });
    return row;
  }

  function imageCtl() {
    const wrap = el('div', 'group');
    const file = $('imgFile');
    const drop = el('div', 'drop');
    drop.tabIndex = 0;
    drop.setAttribute('role', 'button');
    drop.append(el('span', null, 'Background image'), el('span', 'note', 'Drop an image anywhere, or click to choose. Liquid refracts and magnifies what is under it.'));
    drop.addEventListener('click', () => file.click());
    drop.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
    const has = el('div', 'imgrow');
    const thumb = el('span', 'thumb'), name = el('span', 'name');
    const swap = btn('btn', 'Replace'), rm = btn('btn', 'Remove');
    has.append(thumb, name, swap, rm);
    swap.addEventListener('click', () => file.click());
    rm.addEventListener('click', () => app.setImage(null));
    file.addEventListener('change', () => { if (file.files[0]) app.loadImage(file.files[0]); file.value = ''; });
    wrap.append(drop, has);
    refreshers.push(() => {
      drop.hidden = !!app.image; has.hidden = !app.image;
      if (app.image) { name.textContent = app.image.name; thumb.style.backgroundImage = `url(${app.image.thumb})`; }
    });
    return wrap;
  }

  function actionsCtl() {
    const row = el('div', 'btnrow');
    const png = btn('btn primary', 'Export PNG');
    const rec = btn('btn', 'Record video');
    png.addEventListener('click', () => app.exportPNG());
    rec.addEventListener('click', () => app.toggleRecord());
    row.append(png, rec);
    refreshers.push(() => { rec.textContent = app.recorder ? 'Stop recording' : 'Record video'; rec.classList.toggle('on', !!app.recorder); });
    return row;
  }

  function settingsCtl() {
    const row = el('div', 'btnrow');
    bUndo = btn('btn', 'Undo', 'Undo (Ctrl or Cmd + Z)');
    bRedo = btn('btn', 'Redo', 'Redo (Shift + Ctrl or Cmd + Z)');
    const reset = btn('btn', 'Defaults', 'Start again with the settings as they came');
    bUndo.addEventListener('click', () => app.undo());
    bRedo.addEventListener('click', () => app.redo());
    reset.addEventListener('click', () => {
      app.history.push(app.snapshot());
      const d = clone(app.defaults);
      d.placed = clone(app.settings.placed);
      app.applySnapshot({ settings: d, text: app.text.snapshot(), caret: app.caret });
    });
    row.append(bUndo, bRedo, reset);
    return row;
  }
  app.history.onChange = () => { bUndo.disabled = !app.history.canUndo; bRedo.disabled = !app.history.canRedo; };
  app.history.onChange();

  // the stage bar
  const bPause = $('pause');
  bPause.addEventListener('click', () => app.togglePause());
  $('hideui').addEventListener('click', () => app.setUiHidden(true));
  $('dryall').addEventListener('click', () => app.dryAll());
  const bCursor = $('hidecursor');
  bCursor.addEventListener('click', () => { app.set('hideCursor', !app.settings.hideCursor); refreshAll(); });
  $('fullscreen').addEventListener('click', () => app.toggleFullscreen());
  $('showui').addEventListener('click', () => app.setUiHidden(false));

  // drag & drop background images
  window.addEventListener('dragover', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', (e) => { if (e.target === document.body || e.clientX <= 0) document.body.classList.remove('dragging'); });
  window.addEventListener('drop', (e) => {
    e.preventDefault();
    document.body.classList.remove('dragging');
    const f = [...(e.dataTransfer?.files || [])].find(x => /^image\//.test(x.type) || /\.(png|jpe?g|webp|gif|avif|bmp)$/i.test(x.name));
    if (f) app.loadImage(f); else app.toast('Drop an image file to use it as the surface');
  });

  const hudEl = $('hud');
  function refreshAll() {
    refreshers.forEach(f => f());
    bPause.textContent = app.paused ? 'Resume' : 'Pause';
    bCursor.textContent = app.settings.hideCursor ? 'Show cursor' : 'Hide cursor';
    bCursor.classList.toggle('on', !!app.settings.hideCursor);
    bPause.classList.toggle('on', app.paused);
    app.board.classList.toggle('tool-dots', app.settings.tool === 'dots');
    app.board.classList.toggle('tool-wipe', app.settings.tool === 'wipe');
    app.board.classList.toggle('nocursor', !!app.settings.hideCursor);
    app.updateLetterbox();
  }
  refreshAll();

  return {
    refresh: refreshAll,
    tick(dt) { tickers.forEach(f => f(dt)); },
    hud() {
      const total = app.dots?.length || 0;
      const wet = app.dots ? app.dots.reduce((n, d) => n + (d.liquid ? 1 : 0), 0) : 0;
      const name = MATERIALS[app.settings.material].name;
      const vol = app.sim.stats.volume * 1e9;
      const slow = app.sim.slowdown < 0.98 ? ` · sim ${(app.sim.slowdown * app.settings.timeScale).toFixed(2)}×` : '';
      hudEl.innerHTML = `<b>${name}</b> · ${total} dots · ${wet} congealed · ${vol < 1000 ? vol.toFixed(0) + ' mm³' : (vol / 1000).toFixed(2) + ' ml'} · ${Math.round(app.fps)} fps${slow}${app.paused ? ' · <b>paused</b>' : ''}`;
    },
  };
}

function clamp(v, a, b) { return Math.min(Math.max(v, a), b); }


// ---- js/main.js
// sweat: dot type whose dots turn to liquid and congeal into beads
class App {
  constructor() {
    this.settings = defaultSettings();
    this.defaults = defaultSettings();
    this.text = new TextModel('Sweat');
    this.history = new History();
    this.frameCount = 0;
    this.paused = false;
    this.pointer = { inside: false, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, down: null, seen: false };
    this.caret = 5;
    this.focused = false;
    this.dirty = { layout: false, alloc: false, env: false, congeal: false };
    this.lastTime = performance.now();
    this.fps = 60;
    this.exportRequest = null;
    this.liquid = new Set();     // keys of dots that have turned to liquid
    this.geo = new Map();        // geometric mode: hover offset and growth per congealed dot
    this.seen = new Set();       // glyph ids that have already had their share congealed
    this.injectQueue = [];
    this.dots = [];
    this.staticGen = 0;
    this.image = null;
  }

  async init() {
    const q = new URLSearchParams(location.search);
    if (q.has('sim')) { this.settings.perf.simRes = Number(q.get('sim')); this.noAuto = true; }
    if (q.has('rs')) this.settings.perf.renderScale = Number(q.get('rs'));
    if (q.has('mat') && PER_MATERIAL[q.get('mat')]) this.settings.material = q.get('mat');
    if (q.has('text')) this.text.replaceAll(q.get('text'));
    this.reducedMotion = !!window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    this.canvas = document.getElementById('gl');
    this.overlay = document.getElementById('overlay');
    this.board = document.getElementById('board');
    this.stage = document.getElementById('stage');
    this.colL = document.getElementById('colLeft');
    this.colR = document.getElementById('colRight');
    this.stagebar = document.querySelector('.stagebar');
    this.ta = document.getElementById('typing');
    try {
      this.kit = new GLKit(this.canvas);
    } catch (e) {
      this.fatal(e.message);
      return;
    }
    this.setter = new DotSetter();
    this.sim = new Simulation(this.kit);
    this.renderer = new Renderer(this.kit);
    this.ui = buildUI(this);
    this.bindInput();
    this.fitBoard();
    this.allocSim();
    this.rebuildLayout();
    this.restart(false);
    this.renderer.buildEnv(this.settings);
    this.ta.value = this.text.text;
    this.canvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); this.fatal('The GPU context was lost. Reload the page to continue.'); });
    new ResizeObserver(() => this.fitBoard()).observe(this.stage);
    window.addEventListener('resize', () => this.fitBoard());
    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && this.fsHid) { this.fsHid = false; this.setUiHidden(false); }
      this.fitBoard();
    });
    // with the controls hidden, a way back appears whenever the pointer moves
    window.addEventListener('pointermove', () => { if (this.uiHidden) this.peekUi(); });
    requestAnimationFrame((t) => this.loop(t));
    window.sweat = this; // console / test access
  }

  fatal(msg) {
    const el = document.getElementById('fatal');
    if (el) { el.textContent = msg; el.hidden = false; }
    console.error(msg);
  }

  get art() { return artboardSize(this.settings); }
  get mat() { return MATERIALS[this.settings.material]; }
  get matSettings() { return this.settings.mat[this.settings.material]; }

  // ------------------------------------------------------------ state + history
  snapshot() { return { settings: clone(this.settings), text: this.text.snapshot(), caret: this.caret }; }

  applySnapshot(snap) {
    const prev = this.settings;
    this.settings = clone(snap.settings);
    for (const p of OSC_PATHS) {
      if (getPath(prev, 'osc.' + p)?.on && getPath(this.settings, 'osc.' + p)?.on) setPath(this.settings, p, getPath(prev, p));
    }
    const changed = diffPaths(prev, this.settings);
    const textChanged = snap.text.text !== this.text.text || snap.text.ids.join() !== this.text.ids.join();
    this.text.restore(snap.text);
    this.ta.value = this.text.text;
    this.caret = Math.min(snap.caret ?? this.text.text.length, this.text.text.length);
    try { this.ta.setSelectionRange(this.caret, this.caret); } catch (_) { /* hidden */ }
    this.markEffects(changed, textChanged);
    this.ui?.refresh();
  }

  undo() {
    const s = this.history.undo(this.snapshot());
    if (s) this.applySnapshot(s);
  }

  redo() {
    const s = this.history.redo(this.snapshot());
    if (s) this.applySnapshot(s);
  }

  set(path, value, opts = {}) {
    const before = opts.history !== false ? this.snapshot() : null;
    const old = getPath(this.settings, path);
    if (old === value) return;
    setPath(this.settings, path, value);
    if (path === 'cursorRadius') this.ringUntil = performance.now() + 1200;
    if (before) this.history.push(before, opts.mergeKey || null);
    this.markEffects([path]);
  }

  markEffects(paths, textChanged = false) {
    for (const p of paths) {
      if (EFFECTS.reset.has(p)) { this.dirty.alloc = true; }
      if (EFFECTS.layout.has(p) || p.startsWith('placed')) this.dirty.layout = true;
      if (EFFECTS.env.has(p)) this.dirty.env = true;
      if (EFFECTS.congeal.has(p)) this.dirty.congeal = true;
      if (EFFECTS.dots.has(p)) this.renderer.dotsDirty = true;
      if (EFFECTS.union.has(p)) this.staticDirty = true;
      if (p === 'heat.on') this.dirty.layout = true;
      if (p === 'aspect' || p === 'customW' || p === 'customH') this.fitBoard();
      if (p === 'perf.renderScale') this.fitBoard();
      if (p === 'tool') this.ui?.refresh();
    }
    if (textChanged) this.dirty.layout = true;
  }

  // ------------------------------------------------------------ geometry
  fitBoard() {
    if (!this.stage) return;
    const [aw, ah] = this.art;
    const r = this.stage.getBoundingClientRect();
    // the open canvas: clear of the floating columns and the stage bar, or the whole window when hidden
    let L = 0, T = 0, R = r.width, B = r.height;
    if (!this.uiHidden) {
      const floating = getComputedStyle(this.colL).position === 'absolute';
      const gap = 24;
      if (floating) {
        for (const c of [this.colL, this.colR]) {
          const q = c.getBoundingClientRect();
          if (!q.width) continue;
          if (q.left + q.width / 2 - r.left < r.width / 2) L = Math.max(L, q.right - r.left + gap);
          else R = Math.min(R, q.left - r.left - gap);
        }
      } else { L += 16; R -= 16; }
      const sb = this.stagebar.getBoundingClientRect();
      T = Math.max(T, sb.bottom - r.top + 16);
      B -= floating ? 36 : 16;
    }
    const availW = Math.max(100, R - L), availH = Math.max(100, B - T);
    const sc = Math.min(availW / aw, availH / ah);
    const cw = Math.floor(aw * sc), ch = Math.floor(ah * sc);
    this.board.style.width = cw + 'px';
    this.board.style.height = ch + 'px';
    this.board.style.left = Math.round(L + (availW - cw) / 2) + 'px';
    this.board.style.top = Math.round(T + (availH - ch) / 2) + 'px';
    const dpr = Math.min(window.devicePixelRatio || 1, 2) * this.settings.perf.renderScale;
    const pw = Math.max(64, Math.min(3840, Math.round(cw * dpr)));
    const ph = Math.max(64, Math.round(pw * ah / aw));
    if (this.canvas.width !== pw || this.canvas.height !== ph) {
      this.canvas.width = pw; this.canvas.height = ph;
    }
    const odpr = Math.min(window.devicePixelRatio || 1, 2);
    this.overlay.width = Math.round(cw * odpr); this.overlay.height = Math.round(ch * odpr);
    this.overlayScale = odpr;
    this.renderer?.resize(pw, ph);
  }

  simDims() {
    const [aw, ah] = this.art;
    const n = this.settings.perf.simRes;
    if (aw >= ah) return [n, Math.max(8, Math.round(n * ah / aw))];
    return [Math.max(8, Math.round(n * aw / ah)), n];
  }

  get physWidth() { return this.settings.scale / 100; }

  allocSim() {
    const [nx, ny] = this.simDims();
    this.sim.allocate(nx, ny);
    this.dx = this.physWidth / nx;
    this.sim.dx = this.dx;
    const [aw] = this.art;
    this.mToPx = aw / this.physWidth;
    this.pxMm = this.physWidth * 1000 / aw;
  }

  // ------------------------------------------------------------ layout + dots
  rebuildLayout() {
    const s = this.settings;
    const [aw, ah] = this.art;
    const lay = this.setter.layout(this.text.text, this.text.ids, s, { w: aw, h: ah });
    this.layout = lay;
    this.ui?.refresh();
    this.buildDots();
    // newly typed letters sweat their share straight away
    const fresh = lay.glyphs.filter(g => !this.seen.has(g.id));
    if (fresh.length) {
      for (const g of fresh) { this.seen.add(g.id); this.congealGroup(this.dots.filter(d => d.gid === g.id), hash2(s.seed, g.id)); }
      this.sim.uploadGather();
    }
  }

  // every dot on the artboard: glyph dots (keyed by glyph id + index) then placed dots (keyed by -id)
  buildDots() {
    const lay = this.layout;
    const r = lay.r;
    const dots = [];
    const geo = this.geometric, heat = !!this.settings.heat.on;
    const mk = (o, h) => ({ ...o, geo, heat, sp: h & 3, liquid: this.liquid.has(o.key) });
    for (const g of lay.glyphs) {
      g.dots.forEach(([x, y], j) => {
        const key = g.id * 1024 + j;
        dots.push(mk({ key, gid: g.id, x, y, r: g.r }, hash2(key, 99)));
      });
    }
    for (const p of this.settings.placed) {
      const key = -p.id;
      dots.push(mk({ key, gid: -1, x: p.x, y: p.y, r }, hash2(p.id, 7)));
    }
    this.heatMode = heat ? 'all' : 'none';
    this.dots = dots;
    this.dotByKey = new Map(dots.map(d => [d.key, d]));
    this.staticDirty = true;
  }

  uploadStatic() {
    const [, ah] = this.art;
    const list = this.dots.filter(d => !d.liquid);
    const data = new Float32Array(Math.max(1, list.length) * 4);
    list.forEach((d, i) => data.set([d.x, ah - d.y, d.r, 0], i * 4));
    this.renderer.setDots(data, list.length);
    const hl = list.filter(d => d.heat);
    const hdata = new Float32Array(Math.max(1, hl.length) * 4);
    hl.forEach((d, i) => hdata.set([d.x, ah - d.y, d.r, 0], i * 4));
    this.renderer.setHeatDots(hdata, hl.length);
    this.uploadUnion();
    this.staticList = list;
    this.staticGen++;
    this.staticDirty = false;
  }

  toCells(x, y) {
    const [aw, ah] = this.art;
    return [x / aw * this.sim.nx, (1 - y / ah) * this.sim.ny];
  }

  get geometric() { return this.settings.congealStyle === 'geometric'; }

  liquefy(d) {
    if (d.liquid) return;
    d.liquid = true;
    this.liquid.add(d.key);
    // geometric congealing is drawn, not simulated: no liquid goes into the sim
    if (!d.geo) {
      const [cx, cy] = this.toCells(d.x, d.y);
      this.injectQueue.push([cx, cy, d.r / this.art[0] * this.sim.nx, d.sp]);
    }
    this.staticDirty = true;
  }

  // Pathfinder-style union of the congealed dots: each dot, plus a straight bridge to every other
  // congealed dot within reach (in dot spacings)
  uploadUnion() {
    const [, ah] = this.art;
    const s = this.settings;
    // each congealed dot where the hover has moved and grown it to
    const wet = this.dots.filter(d => d.liquid && d.geo).map(d => {
      const g = this.geo.get(d.key);
      return g ? { x: d.x + g.ox, y: d.y + g.oy, r: d.r * g.s, heat: d.heat, x0: d.x, y0: d.y } : { ...d, x0: d.x, y0: d.y };
    });
    const hot = [];
    const n = wet.length;
    const dots = new Float32Array(Math.max(1, n) * 8);
    wet.forEach((d, i) => dots.set([d.x, ah - d.y, d.x, ah - d.y, d.r, d.r, 0, 0], i * 8));
    // reach grows with the dots: two dots swollen to 1.3× reach 1.3× as far
    const r0 = this.layout.r, pitch = this.layout.pitch, base = s.reach * pitch * 1.001;
    const grid = s.bridgeMode === 'grid';
    const reachOf = (a, b) => base * (a.r + b.r) / (2 * r0);
    const reach = base * wet.reduce((m, d) => Math.max(m, d.r / r0), 1);
    const out = [];
    if (reach > 0) {
      // bucket by reach so only nearby pairs are compared
      const cell = new Map();
      const key = (x, y) => x + ',' + y;
      wet.forEach((d, i) => {
        const k = key(Math.floor(d.x / reach), Math.floor(d.y / reach));
        if (!cell.has(k)) cell.set(k, []);
        cell.get(k).push(i);
      });
      wet.forEach((a, i) => {
        const cx = Math.floor(a.x / reach), cy = Math.floor(a.y / reach);
        for (let gy = cy - 1; gy <= cy + 1; gy++) for (let gx = cx - 1; gx <= cx + 1; gx++) {
          for (const j of cell.get(key(gx, gy)) || []) {
            if (j <= i) continue;
            const b = wet[j];
            if (Math.hypot(a.x - b.x, a.y - b.y) > reachOf(a, b)) continue;
            // neighbours only: straight up, down or across on the type's grid, and no further than the next dot
            if (grid) {
              const gx = Math.abs(a.x0 - b.x0), gy = Math.abs(a.y0 - b.y0);
              if (Math.min(gx, gy) > 0.25 * pitch || Math.max(gx, gy) > 1.15 * pitch) continue;
            }
            out.push(a.x, ah - a.y, b.x, ah - b.y, a.r, b.r, 0, 0);
            if (a.heat && b.heat) hot.push(a.x, ah - a.y, b.x, ah - b.y, a.r, b.r, 0, 0);
          }
        }
      });
    }
    this.renderer.setUnion(dots, n, new Float32Array(out.length ? out : new Array(8).fill(0)), out.length / 8, s.bridge);
    // the same shapes again, only those of heat-map lines, for the heat map's own mask
    const hw = wet.filter(d => d.heat);
    const hd = new Float32Array(Math.max(1, hw.length) * 8);
    hw.forEach((d, i) => hd.set([d.x, ah - d.y, d.x, ah - d.y, d.r, d.r, 0, 0], i * 8));
    this.renderer.setHeatUnion(hd, hw.length, new Float32Array(hot.length ? hot : new Array(8).fill(0)), hot.length / 8);
  }

  // turn a share of one letterform's dots to liquid, in random clusters that gather into beads
  congealGroup(dots, seed) {
    const s = this.settings;
    const rng = mulberry32(seed);
    const N = dots.length;
    if (!N || s.amount <= 0) return;
    const want = Math.min(N, Math.floor(s.amount * N + rng()));
    if (!want) return;
    const pitch = this.layout.pitch;
    const near = dots.map((a) => dots.map((b, j) => (a !== b && Math.hypot(a.x - b.x, a.y - b.y) < pitch * 1.5 ? j : -1)).filter(j => j >= 0));
    const taken = new Uint8Array(N);
    if (s.pattern === 'runs') { this.congealRuns(dots, rng, near, want); return; }
    const cellPerPx = this.sim.nx / this.art[0];
    let count = 0, guard = 0;
    while (count < want && guard++ < N * 4) {
      const free = [];
      for (let i = 0; i < N; i++) if (!taken[i]) free.push(i);
      if (!free.length) break;
      const seedI = free[Math.floor(rng() * free.length)];
      const size = Math.min(want - count, Math.max(1, Math.round(s.beadSize * (1 - s.variation * rng()))));
      const cluster = [seedI];
      taken[seedI] = 1;
      const frontier = new Set(near[seedI].filter(j => !taken[j]));
      while (cluster.length < size && frontier.size) {
        const arr = [...frontier];
        const j = arr[Math.floor(rng() * arr.length)];
        frontier.delete(j);
        if (taken[j]) continue;
        taken[j] = 1;
        cluster.push(j);
        near[j].forEach(q => { if (!taken[q]) frontier.add(q); });
      }
      count += cluster.length;
      // degree 1 pulls the whole cluster into a single bead, lower degrees only partway
      const degree = 1 - s.variation * rng() * 0.75;
      const delay = rng() * s.variation * 0.9;
      if (cluster.length > 1) {
        let mx = 0, my = 0;
        cluster.forEach(i => { mx += dots[i].x; my += dots[i].y; });
        mx /= cluster.length; my /= cluster.length;
        const strength = 55 * (0.55 + 0.45 * degree);
        for (const i of cluster) {
          const d = dots[i];
          const [ax, ay] = this.toCells(d.x, d.y);
          const [bx, by] = this.toCells(d.x + (mx - d.x) * degree, d.y + (my - d.y) * degree);
          this.sim.paintGather(ax, ay, bx, by, d.r * cellPerPx * 1.35 + 1.5, strength, this.sim.simTime + delay);
        }
      }
      cluster.forEach(i => this.liquefy(dots[i]));
    }
  }

  // swelling runs: walk along the stroke from a random dot, keeping as straight a line as the letter
  // allows, and make each dot a little bigger than the last (or swell toward the middle of the run)
  congealRuns(dots, rng, near, want) {
    const s = this.settings, pitch = this.layout.pitch;
    const N = dots.length, taken = new Uint8Array(N);
    let count = 0, guard = 0;
    while (count < want && guard++ < N * 4) {
      const free = [];
      for (let i = 0; i < N; i++) if (!taken[i]) free.push(i);
      if (!free.length) break;
      // every run is the full length: when one end runs out of free dots it grows from the other
      const len = Math.max(2, Math.round(s.runLength));
      const path = [free[Math.floor(rng() * free.length)]];
      taken[path[0]] = 1;
      const step = (from, dir) => {
        const a = dots[from];
        let best = -1, bs = Infinity;
        for (const j of near[from]) {
          if (taken[j]) continue;
          const b = dots[j], dx = b.x - a.x, dy = b.y - a.y, dl = Math.hypot(dx, dy);
          // nearest first, then the straightest continuation of the run so far
          const turn = dir ? 1 - (dx * dir[0] + dy * dir[1]) / dl : 0;
          const sc = dl / pitch + 0.9 * turn + 0.15 * rng();
          if (sc < bs) { bs = sc; best = j; }
        }
        return best;
      };
      const dirOf = (p, q) => { const dx = dots[q].x - dots[p].x, dy = dots[q].y - dots[p].y, l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
      let tailOpen = true, headOpen = true;
      while (path.length < len && (tailOpen || headOpen)) {
        if (tailOpen) {
          const n1 = path.length;
          const j = step(path[n1 - 1], n1 > 1 ? dirOf(path[n1 - 2], path[n1 - 1]) : null);
          if (j < 0) tailOpen = false; else { taken[j] = 1; path.push(j); continue; }
        }
        if (headOpen) {
          const j = step(path[0], path.length > 1 ? dirOf(path[1], path[0]) : null);
          if (j < 0) headOpen = false; else { taken[j] = 1; path.unshift(j); }
        }
      }
      count += path.length;
      const rate = Math.max(0, s.growth * (1 + s.variation * (rng() - 0.5)));
      const n = path.length;
      path.forEach((idx, i) => {
        const d = dots[idx];
        // exponential: each step multiplies the size by (1 + rate), so the peak stands well clear of
        // its neighbours. ramp: bigger dot by dot; swell: biggest in the middle; both: the two together
        const sw = Math.min(i, n - 1 - i);
        const steps = s.runShape === 'swell' ? sw : s.runShape === 'both' ? i + sw : i;
        const k = Math.pow(1 + rate, steps);
        this.liquefy(d);
        this.geo.set(d.key, { s: k, base: k, ox: 0, oy: 0, w: 0, px: d.x, py: d.y });
      });
    }
  }

  // dry everything, then congeal every letterform (and the placed dots) from the current seed
  restart(toast) {
    this.geo.clear();
    this.sim.clear();
    this.liquid.clear();
    this.injectQueue.length = 0;
    this.seen.clear();
    this.buildDots();
    const s = this.settings;
    for (const g of this.layout.glyphs) {
      this.seen.add(g.id);
      this.congealGroup(this.dots.filter(d => d.gid === g.id), hash2(s.seed, g.id));
    }
    const placed = this.dots.filter(d => d.gid === -1);
    if (placed.length) this.congealGroup(placed, hash2(s.seed, 0x5eed));
    this.sim.uploadGather();
    this.dirty.congeal = false;
    if (toast) this.toast('Restarted');
  }

  randomize() {
    this.set('seed', (Math.random() * 1e9) | 0);
    this.restart(false);
    this.toast('Random congeal');
    this.ui?.refresh();
  }

  dryAll() {
    this.geo.clear();
    this.sim.clear();
    this.liquid.clear();
    this.injectQueue.length = 0;
    this.buildDots();
    this.toast('Dried');
  }

  // ------------------------------------------------------------ background image
  async loadImage(file) {
    try {
      const bmp = await createImageBitmap(file);
      const max = Math.min(4096, this.kit.gl.getParameter(this.kit.gl.MAX_TEXTURE_SIZE));
      const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(bmp.width * sc)); cv.height = Math.max(1, Math.round(bmp.height * sc));
      cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
      const th = document.createElement('canvas');
      th.width = 80; th.height = Math.max(1, Math.round(80 * cv.height / cv.width));
      th.getContext('2d').drawImage(cv, 0, 0, th.width, th.height);
      const px = th.getContext('2d').getImageData(0, 0, th.width, th.height).data;
      const sum = [0, 0, 0];
      for (let i = 0; i < px.length; i += 4) for (let c = 0; c < 3; c++) sum[c] += px[i + c];
      const avg = '#' + sum.map(v => Math.round(v / (px.length / 4)).toString(16).padStart(2, '0')).join('');
      this.setImage({ canvas: cv, name: file.name || 'image', thumb: th.toDataURL('image/jpeg', 0.7), w: cv.width, h: cv.height, avg });
    } catch (e) {
      this.toast('Could not read that image');
    }
  }

  setImage(img) {
    this.image = img;
    this.renderer.setImage(img ? img.canvas : null);
    this.dirty.env = true;
    this.ui?.refresh();
    if (img) this.toast('Surface image loaded');
  }

  imageXf() {
    if (!this.image) return [1, 1, 0, 0];
    const [aw, ah] = this.art;
    const a = aw / ah, b = this.image.w / this.image.h;
    const im = this.settings.image;
    let sx, sy;
    if ((im.fit === 'contain') === (b > a)) { sx = 1; sy = b / a; } else { sx = a / b; sy = 1; }
    const z = Math.max(im.zoom, 0.01);
    return [sx / z, sy / z, -im.x * 0.5, im.y * 0.5];
  }

  // ------------------------------------------------------------ input
  bindInput() {
    const b = this.board;
    const toArt = (e) => {
      const r = b.getBoundingClientRect();
      const [aw, ah] = this.art;
      return [(e.clientX - r.left) / r.width * aw, (e.clientY - r.top) / r.height * ah];
    };
    const hint = document.getElementById('hint');
    let hintArmed = false;
    const dismissHint = () => { if (hintArmed || !hint) return; hintArmed = true; setTimeout(() => hint.classList.add('gone'), 2500); };
    const enter = (e) => {
      this.pointer.inside = true;
      [this.pointer.x, this.pointer.y] = toArt(e);
      if (!this.pointer.seen) { this.pointer.px = this.pointer.x; this.pointer.py = this.pointer.y; this.pointer.seen = true; }
    };
    b.addEventListener('pointerenter', enter);
    b.addEventListener('pointerleave', () => { this.pointer.inside = false; });
    b.addEventListener('pointermove', (e) => {
      dismissHint();
      enter(e);
      if (this.pointer.down && this.settings.tool === 'dots') this.dragDots(e.altKey);
    });
    b.addEventListener('pointerdown', (e) => {
      const [x, y] = toArt(e);
      this.pointer.x = x; this.pointer.y = y; this.pointer.inside = true;
      if (e.pointerType === 'touch') { this.pointer.px = x; this.pointer.py = y; }
      this.pointer.down = { x: e.clientX, y: e.clientY, t: performance.now(), id: e.pointerId };
      b.setPointerCapture?.(e.pointerId);
      if (this.settings.tool === 'dots') {
        this.dotGesture = this.snapshot();
        this.lastDot = null;
        this.dragDots(e.altKey);
      }
      e.preventDefault();
    });
    const up = (e) => {
      const d = this.pointer.down;
      this.pointer.down = null;
      if (e.pointerType === 'touch') this.pointer.inside = false;
      if (this.dotGesture) {
        if (JSON.stringify(this.dotGesture.settings.placed) !== JSON.stringify(this.settings.placed)) this.history.push(this.dotGesture);
        this.dotGesture = null;
        this.ui?.refresh();
        return;
      }
      if (!d || this.settings.tool !== 'congeal') return;
      // a click or tap (not a drag) places the text caret
      const moved = Math.hypot(e.clientX - d.x, e.clientY - d.y);
      if (moved > 8 || (e.pointerType !== 'mouse' && performance.now() - d.t > 350)) return;
      const [x, y] = toArt(e);
      this.caret = this.setter.hitTest(this.layout, x, y);
      this.ta.focus({ preventScroll: true });
      this.ta.setSelectionRange(this.caret, this.caret);
      this.history.breakMerge();
    };
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', () => { this.pointer.down = null; this.pointer.inside = false; this.dotGesture = null; });
    this.ta.addEventListener('focus', () => { this.focused = true; this.board.classList.add('typing'); });
    this.ta.addEventListener('blur', () => { this.focused = false; this.board.classList.remove('typing'); });
    this.ta.addEventListener('beforeinput', () => { this._preEdit = this.snapshot(); });
    this.ta.addEventListener('input', () => {
      const before = this._preEdit || this.snapshot();
      this._preEdit = null;
      if (this.text.update(this.ta.value)) {
        this.history.push(before, 'typing', 1200);
        this.dirty.layout = true;
        this.ui?.refresh();
      }
      this.caret = this.ta.selectionStart;
    });
    const syncCaret = () => { if (this.focused) this.caret = this.ta.selectionStart; };
    this.ta.addEventListener('keyup', syncCaret);
    this.ta.addEventListener('select', syncCaret);
    document.addEventListener('selectionchange', syncCaret);
    window.addEventListener('keydown', (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (mod && (e.key === 'z' || e.key === 'Z')) {
        e.preventDefault();
        if (e.shiftKey) this.redo(); else this.undo();
        return;
      }
      if (mod && (e.key === 'y' || e.key === 'Y')) { e.preventDefault(); this.redo(); return; }
      if (e.key === 'Escape' && this.focused) { this.ta.blur(); return; }
      if (e.key === 'Escape' && this.uiHidden && !document.fullscreenElement) { this.setUiHidden(false); return; }
      const a = document.activeElement;
      const editing = this.focused || a?.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(a?.tagName);
      if (!editing && !mod && !e.altKey) {
        const k = e.key.toLowerCase();
        if (e.key === ' ' && (a === document.body || !a)) { e.preventDefault(); this.togglePause(); }
        else if (k === 'r') this.restart(true);
        else if (k === 'g') this.randomize();
        else if (k === 'h') this.setUiHidden(!this.uiHidden);
        else if (k === 'f') this.toggleFullscreen();
      }
    }, true);
  }

  // place dots along the drag at the type's dot pitch; alt removes placed dots instead
  dragDots(remove) {
    const p = this.pointer;
    const r = this.layout.r, pitch = this.layout.pitch;
    if (remove) {
      const keep = this.settings.placed.filter(d => Math.hypot(d.x - p.x, d.y - p.y) > Math.max(r * 1.2, 6));
      if (keep.length !== this.settings.placed.length) this.set('placed', keep, { history: false });
      return;
    }
    if (this.lastDot && Math.hypot(p.x - this.lastDot[0], p.y - this.lastDot[1]) < pitch) return;
    const id = this.settings.placed.reduce((m, d) => Math.max(m, d.id), 0) + 1;
    this.set('placed', [...this.settings.placed, { id, x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 }], { history: false });
    this.lastDot = [p.x, p.y];
  }

  togglePause() { this.paused = !this.paused; this.ui?.refresh(); }

  // text typed into the panel's field: one undo step per burst of typing
  setText(v) {
    const before = this.snapshot();
    if (!this.text.update(v)) return;
    this.history.push(before, 'typing', 1200);
    this.dirty.layout = true;
    this.ta.value = this.text.text;
    this.caret = Math.min(this.caret, this.text.text.length);
  }

  // the artwork alone: controls hidden, the artboard fitted to the whole window
  setUiHidden(off) {
    this.uiHidden = !!off;
    document.documentElement.classList.toggle('ui-off', this.uiHidden);
    if (this.uiHidden) { this.ta.blur(); this.peekUi(); this.toast('Press H or Esc to show the controls'); }
    else document.documentElement.classList.remove('peek', 'idle');
    this.fitBoard();
  }

  peekUi() {
    const h = document.documentElement;
    h.classList.add('peek'); h.classList.remove('idle');
    clearTimeout(this._peekT);
    this._peekT = setTimeout(() => { h.classList.remove('peek'); h.classList.add('idle'); }, 1800);
  }

  toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen?.(); return; }
    const el = document.documentElement;
    if (!el.requestFullscreen) { this.setUiHidden(true); return; }
    this.fsHid = !this.uiHidden;
    this.setUiHidden(true);
    el.requestFullscreen().catch(() => { this.fsHid = false; });
  }

  // the margin round a fitted artboard, coloured like its surface so the artwork reads edge to edge
  updateLetterbox() {
    const c = this.image ? '#000000' : this.matSettings.background;
    document.documentElement.style.setProperty('--letter', c);
  }

  endDrag() { this.dragging = false; }

  toast(msg) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(this._toastT);
    this._toastT = setTimeout(() => el.classList.remove('show'), 1600);
  }

  // ------------------------------------------------------------ frame
  loop(now) {
    requestAnimationFrame((t) => this.loop(t));
    let dt = (now - this.lastTime) / 1000;
    this.lastTime = now;
    if (!(dt > 0)) dt = 1 / 60;
    dt = Math.min(dt, 0.1);
    this.fps = this.fps * 0.95 + (1 / Math.max(dt, 1e-3)) * 0.05;
    this.frame(dt);
  }

  // spherical-cap height of a dot bead (artboard px)
  capPx(r) {
    const th = Math.min(Math.max(this.matSettings.contactAngle, 12), 88) * Math.PI / 180;
    return r / Math.sin(th) * (1 - Math.cos(th));
  }

  frame(dt) {
    if (!this.paused) this.ui?.tick(dt);
    const s = this.settings;
    if (this.dirty.alloc) { this.allocSim(); this.dirty.alloc = false; this.dirty.layout = true; this.dirty.congeal = true; }
    if (this.dirty.layout) { this.rebuildLayout(); this.dirty.layout = false; }
    if (this.dirty.congeal) this.restart(false);
    if (this.dirty.env) { this.renderer.buildEnv(s, this.image?.avg); this.dirty.env = false; this.updateLetterbox(); }

    const [aw, ah] = this.art;
    const nx = this.sim.nx, ny = this.sim.ny;
    const p = this.pointer;
    const ms = this.matSettings;
    const tool = s.tool;
    const active = p.inside && !this.focused && (tool !== 'congeal' || s.liquefy === 'hover' || !!p.down);

    // cursor turns the dots it touches to liquid (sweeping the segment travelled this frame)
    if (tool === 'congeal' && active && !this.paused) {
      const R = s.cursorRadius;
      const ax = p.px, ay = p.py, bx = p.x, by = p.y;
      const sx = bx - ax, sy = by - ay, l2 = sx * sx + sy * sy;
      for (const d of this.dots) {
        if (d.liquid) continue;
        const t = l2 > 0 ? clamp(((d.x - ax) * sx + (d.y - ay) * sy) / l2, 0, 1) : 1;
        if (Math.hypot(d.x - (ax + sx * t), d.y - (ay + sy * t)) < R * 0.85 + d.r * 0.3) this.liquefy(d);
      }
    }
    // geometric hover: congealed dots the cursor passes over swell and drift toward it, and stay that way
    // (each keeps the strongest touch it has had, pulled toward where the cursor was at that moment)
    if (this.geometric && !this.paused && (this.geo.size || (tool === 'congeal' && active && (s.hoverGrow > 0 || s.hoverPull > 0)))) {
      const on = tool === 'congeal' && active, R = Math.max(s.cursorRadius, 1);
      const k = 1 - Math.exp(-dt * 9);
      let moved = false;
      for (const d of this.dots) {
        if (!d.liquid || !d.geo) continue;
        let w = 0;
        if (on) {
          const t = Math.hypot(d.x - p.x, d.y - p.y) / R;
          w = t < 1 ? (1 - t * t) * (1 - t * t) : 0;
        }
        let g = this.geo.get(d.key);
        if (!g) { if (!w) continue; g = { s: 1, base: 1, ox: 0, oy: 0, w: 0, px: d.x, py: d.y }; this.geo.set(d.key, g); }
        if (w > g.w) { g.w = w; g.px = p.x; g.py = p.y; }
        const ts = (g.base || 1) * (1 + s.hoverGrow * g.w), tx = (g.px - d.x) * s.hoverPull * g.w, ty = (g.py - d.y) * s.hoverPull * g.w;
        const ns = g.s + (ts - g.s) * k, nx = g.ox + (tx - g.ox) * k, ny = g.oy + (ty - g.oy) * k;
        if (Math.abs(ns - g.s) > 1e-4 || Math.abs(nx - g.ox) > 0.01 || Math.abs(ny - g.oy) > 0.01) moved = true;
        g.s = ns; g.ox = nx; g.oy = ny;
      }
      if (moved && !this.staticDirty) this.uploadUnion();
    }
    if (this.staticDirty) this.uploadStatic();
    // the dry tool: congealed dots under the cursor go back to plain dots
    if (tool === 'wipe' && p.down && p.inside && !this.paused) {
      const R = s.cursorRadius;
      const ax = p.px, ay = p.py, sx = p.x - ax, sy = p.y - ay, l2 = sx * sx + sy * sy;
      for (const d of this.dots) {
        if (!d.liquid) continue;
        const t = l2 > 0 ? clamp(((d.x - ax) * sx + (d.y - ay) * sy) / l2, 0, 1) : 1;
        if (Math.hypot(d.x - (ax + sx * t), d.y - (ay + sy * t)) < R * 0.85 + d.r * 0.3) {
          d.liquid = false; this.liquid.delete(d.key); this.geo.delete(d.key); this.staticDirty = true;
        }
      }
    }
    if (this.injectQueue.length) {
      this.sim.inject(this.injectQueue, ms.contactAngle);
      this.injectQueue.length = 0;
      this.simUsed = true;
    }

    // cursor velocity (m/s, sim axes), smoothed
    const vx = (p.x - p.px) / Math.max(dt, 1e-3) / this.mToPx, vy = -(p.y - p.py) / Math.max(dt, 1e-3) / this.mToPx;
    p.vx = p.vx * 0.6 + vx * 0.4; p.vy = p.vy * 0.6 + vy * 0.4;
    const cellPerPx = nx / aw;
    const r0 = this.layout.r;
    // congealing is geometric: the liquid sim only runs if something ever put liquid into it
    if (!this.paused && this.simUsed) {
      const ph = {
        dx: this.dx, rhoL: this.mat.rhoL,
        sigma: ms.surfaceTension / 1000, viscosity: ms.viscosity / 1000, theta: ms.contactAngle,
        gravity: s.gravity, gravityAngle: s.gravityAngle, pinning: ms.pinning, coalesce: s.coalesce,
        timeScale: s.timeScale,
        bond: clamp(Math.pow(2.5 / (r0 * this.pxMm), 2), 0.08, 1),
      };
      const pressed = !!p.down;
      const congealOn = tool === 'congeal' && active;
      const forces = {
        cur: [p.x * cellPerPx, (1 - p.y / ah) * ny, s.cursorRadius * cellPerPx, (congealOn || (tool === 'wipe' && pressed && p.inside)) ? 1 : 0],
        curVel: [p.vx, p.vy],
        pull: congealOn ? s.pull * s.pull * 90 * (pressed ? 1.6 : 1) : 0,
        drag: congealOn && pressed ? s.carry * 45 : 0,
        wipe: tool === 'wipe' && pressed && p.inside,
        life: 2.6, gatherR: Math.max(r0 * cellPerPx * 1.2, 1.5),
        bulkLod: clamp(Math.log2(Math.max(r0 * cellPerPx, 1)), 0, 5),
        href: 0.42 * this.capPx(r0) / this.mToPx, pxToM: 1 / this.mToPx,
      };
      this.sim.step(dt, ph, forces, s.perf.maxSubsteps);
    }
    p.px = p.x; p.py = p.y;
    if (this.frameCount % 12 === 0) this.sim.requestStats();

    // beads that run over a dry dot pick it up
    // every dry dot is live: liquid that reaches one fuses with it
    if (!this.paused && this.dots.some(d => !d.geo) && this.frameCount % 3 === 0 && this.staticList?.length) {
      const gen = this.staticGen, list = this.staticList;
      const thr = 0.15 * this.capPx(r0) / this.mToPx;
      // in the heavier weights neighbouring dots overlap, so the ring stays inside the gap they leave
      const lay = this.layout;
      const ring = clamp(Math.min(0.45, 0.85 * (lay.pitch - lay.r) / lay.r), 0.1, 0.45);
      this.sim.probe(this.renderer.dotData, list.length, [cellPerPx, ny / ah], ring, (data) => {
        if (gen !== this.staticGen) return;
        for (let i = 0; i < list.length; i++) {
          if (data[i * 4] <= thr) continue;
          const d = this.dotByKey.get(list[i].key);
          if (d) this.liquefy(d);
        }
      });
    }

    this.renderer.render({
      art: [aw, ah], sim: this.sim, mToPx: this.mToPx, pxMm: this.pxMm, settings: s,
      heatMode: this.heatMode, dotTheta: ms.contactAngle, hmaxPx: Math.max(this.capPx(r0), this.sim.hmaxEst * this.mToPx),
      imgXf: this.imageXf(), staticGrain: this.reducedMotion,
    }, this.paused ? 0 : dt);

    if (this.exportRequest) { const r = this.exportRequest; this.exportRequest = null; r(); }
    this.drawOverlay();
    if (this.frameCount % 15 === 0) this.ui?.hud();
    this.autoQuality(dt);
    this.frameCount++;
  }

  autoQuality(dt) {
    if (this.autoDone || this.noAuto || document.hidden) return;
    this.aqFrames = (this.aqFrames || 0) + 1;
    this.aqTime = (this.aqTime || 0) + dt;
    if (this.aqFrames < 150) return;
    const fps = this.aqFrames / this.aqTime;
    this.aqFrames = 0; this.aqTime = 0;
    const perf = this.settings.perf;
    if (fps < 36 && perf.simRes > 384) {
      perf.simRes = 384; this.dirty.alloc = true;
      this.defaults.perf.simRes = 384;
      this.toast('Using medium simulation quality for a smoother frame rate');
      this.ui?.refresh();
    } else if (fps < 30 && perf.renderScale > 0.7) {
      perf.renderScale = 0.7; this.fitBoard(); this.autoDone = true;
      this.toast('Lowered render scale for a smoother frame rate');
      this.ui?.refresh();
    } else {
      this.autoDone = true;
    }
  }

  drawOverlay() {
    const o = this.overlay, ctx = o.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, o.width, o.height);
    const [aw] = this.art;
    const k = o.width / aw;
    const s = this.settings;
    const bgDark = luminance(this.matSettings.background) < 0.35;
    const ink = bgDark ? 'rgba(255,255,255,0.85)' : 'rgba(20,24,28,0.85)';
    if (this.focused && this.layout) {
      const c = this.layout.carets[Math.min(this.caret, this.layout.carets.length - 1)];
      if (c && (this.reducedMotion || Math.floor(performance.now() / 530) % 2 === 0)) {
        const top = c.y - this.layout.capHeight * 1.08, bot = c.y + this.layout.capHeight * 0.14;
        ctx.fillStyle = ink;
        ctx.fillRect(Math.round(c.x * k) - 1, top * k, Math.max(1.5, 2 * this.overlayScale), (bot - top) * k);
      }
    }
    const p = this.pointer;
    ctx.lineWidth = 1 * this.overlayScale;
    ctx.strokeStyle = bgDark ? 'rgba(255,255,255,0.55)' : 'rgba(30,30,34,0.5)';
    // dot tool: preview of the dot about to be placed
    if (s.tool === 'dots' && p.inside && this.layout) {
      ctx.setLineDash([2 * this.overlayScale, 3 * this.overlayScale]);
      ctx.beginPath(); ctx.arc(p.x * k, p.y * k, this.layout.r * k, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      return;
    }
    if (performance.now() < (this.ringUntil || 0) || (s.tool === 'wipe' && p.inside)) {
      const [, ah] = this.art;
      const cx = p.inside ? p.x : aw / 2, cy = p.inside ? p.y : ah / 2;
      ctx.setLineDash([3 * this.overlayScale, 4 * this.overlayScale]);
      ctx.beginPath(); ctx.arc(cx * k, cy * k, s.cursorRadius * k, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  async saveFile(blob, filename) {
    if (window.claude && typeof window.claude.use === 'function') {
      let dl = null;
      try { dl = await window.claude.use('downloads'); } catch (_) { dl = null; }
      if (dl) {
        try {
          await dl.save({ filename, data: blob });
          this.toast('Saved ' + filename);
        } catch (e) {
          const code = e && e.code;
          if (code === 'declined') return;
          if (code === 'rate_limited') this.toast('A save prompt is already open');
          else if (code === 'too_large') this.toast('That file is too large to save here');
          else this.toast('Saving files is not available in this view');
        }
        return;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  exportPNG() {
    this.exportRequest = () => {
      this.canvas.toBlob((blob) => {
        if (blob) this.saveFile(blob, `sweat-${stamp()}.png`);
      }, 'image/png');
    };
  }

  toggleRecord() {
    if (this.recorder) {
      this.recorder.stop();
      return;
    }
    if (!this.canvas.captureStream || !window.MediaRecorder) { this.toast('Recording is not supported in this browser'); return; }
    const mime = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'].find(m => MediaRecorder.isTypeSupported(m));
    if (!mime) { this.toast('Recording is not supported in this browser'); return; }
    const stream = this.canvas.captureStream(60);
    const chunks = [];
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16e6 });
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      this.recorder = null;
      this.ui?.refresh();
      this.saveFile(blob, `sweat-${stamp()}.${mime.includes('mp4') ? 'mp4' : 'webm'}`);
    };
    rec.start();
    this.recorder = rec;
    this.toast('Recording… press Stop recording to save');
    this.ui?.refresh();
  }
}

function stamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function luminance(hex) {
  const v = parseInt(hex.slice(1), 16);
  return (0.2126 * ((v >> 16) & 255) + 0.7152 * ((v >> 8) & 255) + 0.0722 * (v & 255)) / 255;
}

function diffPaths(a, b, prefix = '') {
  const out = [];
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) {
    const pa = a?.[k], pb = b?.[k];
    const path = prefix ? prefix + '.' + k : k;
    if (pa && pb && typeof pa === 'object' && typeof pb === 'object') out.push(...diffPaths(pa, pb, path));
    else if (pa !== pb) out.push(path);
  }
  return out.map(p => p.replace(/^mat\.(sweat|ink|mercury)\./, 'mat.'));
}

const app = new App();
app.init();

</script>
</body>
